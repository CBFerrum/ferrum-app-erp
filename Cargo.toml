# ERP and its add-ons (Ferrum docs/plan/erp-repo.md): the app itself (this crate: its manifest,
# its interface, its packages and its engine) and India, Finance, Procurement, Stock Operations and
# Manufacturing Operations (addons/). The Ferrum server compiles them in; they build on the
# platform's crates, taken from Ferrum's main, and other apps build on this one.
[workspace]
resolver = "3"
members = [".", "promotions", "pricing", "addons/india", "addons/eu", "addons/de", "addons/gb", "addons/ca", "addons/us", "addons/countries", "addons/eu-members", "addons/finance", "addons/procurement", "addons/stock-ops", "addons/mfg-ops", "addons/quality", "addons/wms", "addons/mes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CBFerrum/ferrum-app-erp"

[workspace.dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-calc = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-apps = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-plugins = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-ops = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
# The browser builds (promotions, pricing) use the wasm-bindgen Ferrum-Frontend pins, so one
# wasm-bindgen-cli builds them and @ferrum/calc alike.
wasm-bindgen = "=0.2.129"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }

[workspace.lints.clippy]
# Deliberate patterns shared with the platform: sqlx row tuples, index-based maths, engine entry points.
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[package]
name = "ferrum-app-erp"
description = "ERP for Ferrum: accounting, selling, buying, stock and manufacturing; its manifest, interface, packages and engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
ferrum-kernel = { workspace = true }
ferrum-meta = { workspace = true }
ferrum-domain = { workspace = true }
ferrum-calc = { workspace = true }
ferrum-erp-promotions = { path = "promotions" }
ferrum-erp-pricing = { path = "pricing" }
async-trait = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Carrier connections (src/shipping.rs): described HTTP calls, rendered as the platform's message channels are.
base64 = "0.22"
hex = { workspace = true }
hmac = "0.12"
minijinja = { version = "2", features = ["fuel"] }
serde = { workspace = true }

[dev-dependencies]
ferrum-apps = { workspace = true }
# The end-to-end test runs ERP with India's rules, sandboxed plugins and a fake IRP.
ferrum-india = { path = "addons/india" }
# Batches, for the scan and label tests.
ferrum-stock-ops = { path = "addons/stock-ops" }
ferrum-plugins = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }

[lints]
workspace = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
