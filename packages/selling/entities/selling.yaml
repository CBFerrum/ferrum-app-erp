- name: PricingRule
  label: Pricing Rule
  kind: master
  module: selling
  title_field: title
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: apply_on, type: select, options: [Item, Item Group, All Items], required: true, default: Item, in_list: true}
    - {name: item, type: link, to: Item, visible_if: "doc.apply_on == 'Item'", required_if: "doc.apply_on == 'Item'"}
    - {name: item_group, type: link, to: ItemGroup, visible_if: "doc.apply_on == 'Item Group'", required_if: "doc.apply_on == 'Item Group'"}
    - {name: customer, type: link, to: Customer}
    - {name: customer_group, type: link, to: CustomerGroup}
    - {name: min_qty, type: decimal, default: 0, min: "0"}
    - {name: max_qty, type: decimal, default: 0, min: "0", description: 0 = no maximum}
    - {name: valid_from, type: date}
    - {name: valid_upto, type: date}
    - {name: discount_percent, type: percent, min: "0", max: "100", in_list: true}
    - {name: rate, type: currency, min: "0", description: Fixed rate (overrides the price list)}
    - {name: priority, type: int, default: 1, min: 1, max: 100, in_list: true}
    - {name: condition, type: code, description: "Optional CEL condition, e.g. doc.customer_name.startsWith('Acme')"}
    - {name: disabled, type: check, in_filter: true}
  rules:
    - {name: something_to_apply, check: "doc.discount_percent > 0.0 || doc.rate > 0.0", message: "Set a discount or a rate"}

- name: SalesOrderItem
  label: Sales Order Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true, description: "Empty for a line that is not an item: a service, a fee, a one-off charge, described below"}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, description: "The item's name, or the line's description when it has no item"}
    - {name: description, type: text, description: "What the line is; needed on a line without an item"}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: conversion_factor, type: decimal, read_only: true, label: Stock Units per Unit}
    - {name: stock_qty, type: decimal, read_only: true, label: Qty in Stock Unit}
    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: price_list_rate, type: currency, read_only_if: "doc.item != null", description: "From the price list for an item; entered for a line without one"}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: promotion_percent, type: data, hidden: true, label: Promotions' Share,
       description: "The exact share of the line's amount promotions take off (after its own discount), kept as text so a return gives back the same share"}
    - {name: added_by_promotion, type: link, to: Promotion, hidden: true, label: Added By Promotion, description: "A free item a promotion added"}
    - {name: promotion_returned, type: json, hidden: true, read_only: true, no_copy: true, label: Promotions Given Back,
       description: "What credit notes gave back of the promotions on this line so far: the quantity and the amount per promotion, so the last part returned takes exactly what is left"}
    - {name: rate, type: currency, read_only: true, in_list: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: delivery_date, type: date}
    - {name: available_qty, type: decimal, read_only: true, no_copy: true, label: Available When Entered,
       description: "In stock units, at the line's warehouse when the draft was last saved: on hand less what open orders have yet to take"}
    - {name: promised_date, type: date, label: Promised Date, description: "The day the line can be delivered, from what is available and coming in, else the item's lead time; filled when empty, kept once set"}
    - {name: stock_reserved_qty, type: decimal, read_only: true, no_copy: true, label: Reserved (Stock Units),
       description: "Held for this line under the Hold reservation policy; delivering it uses the reservation up"}
    - {name: backorder_qty, type: decimal, read_only: true, no_copy: true, label: Back-Ordered (Stock Units), description: "What could not be reserved when it was last tried"}
    - {name: reserved_until, type: date, read_only: true, no_copy: true, label: Reserved Until}
    - {name: delivered_qty, type: decimal, read_only: true, no_copy: true, in_list: true, description: "Above the quantity when more was delivered, within the over-delivery allowance"}
    - {name: billed_qty, type: decimal, read_only: true, no_copy: true}
    - {name: closed_qty, type: decimal, read_only: true, no_copy: true, label: Closed Short, description: "What was still open on the line when the order was closed: never delivered or billed"}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: tax_categories, type: json, read_only: true, description: "Each tax account's category and exemption reason for the line"}

- name: SalesOrder
  label: Sales Order
  kind: document
  module: selling
  submittable: true
  company_scoped: true
  title_field: customer_name
  numbering: {template: "SO-{FY}-{seq:5}", on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: number_series, type: link, to: NumberSeries, no_copy: true, label: Numbering Series, in_filter: true,
       description: "The series this document is numbered from when it is submitted: one of those set up for it (a tax invoice, a branch). Empty: the series the company's settings or its country's rules give, else the usual one"}
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, label: Order Date, in_list: true, in_filter: true}
    - {name: delivery_date, type: date}
    - {name: po_no, type: data, label: Customer PO No}
    - {name: customer_address, type: link, to: Address, label: Billing Address, description: "The customer's; their primary billing address when empty"}
    - {name: ship_to, type: link, to: Address, label: Ship To, description: "Where the goods go: the customer's primary shipping address when empty. Countries' tax rules read its country and region"}
    - {name: delivery_country, type: data, label: Delivery Country, description: "Where the goods go when there is no ship-to address: a country name or ISO code, kept as the code. Follows the ship-to address when there is one"}
    - {name: delivery_region, type: data, label: Delivery Region, description: "The state, province or region the goods go, as countries' tax rules read it. Follows the ship-to address when there is one"}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: price_list, type: link, to: PriceList}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: SalesOrderItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: discount_percent, type: percent, min: "0", max: "100", label: Additional Discount %}
    - {name: channel, type: data, label: Channel, description: "Where the sale is made (Web Shop, Point of Sale, ...), as promotions name it; empty: this document's kind"}
    - {name: promotion_codes, type: data, label: Promotion Codes, no_copy: true, description: "Codes the customer gives, separated by commas or spaces"}
    - {name: applied_promotions, type: table, of: AppliedPromotion, read_only: true, no_copy: true, label: Promotions Applied}
    - {name: given_promotions, type: json, hidden: true, no_copy: true, label: Promotions an App Applied,
       description: "What an app that priced the sale itself (a till) says it applied: {snapshot, source, counted, at, applied: [{promotion, line, amount, code}]}. Checked against the promotion records, then kept in Promotions Applied; the lines are not discounted again"}
    - {name: tax_registrations, type: json, read_only: true, no_copy: true, label: Tax Registrations,
       description: "The seller's and the buyer's tax registrations (label and value) and whether the buyer is a registered business, as the countries' add-ons say, kept as the draft was last priced"}
    - {name: total, type: currency, read_only: true}
    - {name: net_total, type: currency, read_only: true}
    - {name: total_taxes, type: currency, read_only: true}
    - {name: grand_total, type: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, read_only: true}
    - {name: rounded_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: per_delivered, type: percent, read_only: true, no_copy: true}
    - {name: per_billed, type: percent, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, To Deliver and Bill, To Deliver, To Bill, Completed, Closed, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: project, type: link, to: Project}
    - {name: terms, type: text}
    - {name: print_as_proforma, type: check, label: Print as Pro Forma Invoice, no_copy: true,
       description: "The printed order is titled Pro Forma Invoice and carries the bank details: for a customer who pays in advance or needs it for customs or a bank"}
    - {name: credit_release_reason, type: data, perm_group: credit, no_copy: true, label: Credit Release Reason,
       description: "Lets this order through over the customer's credit limit; filled in by someone allowed to release credit, and kept"}
  actions:
    - {name: make_delivery_note, label: Create Delivery Note, docstatus: [1], permission: read, condition: "doc.per_delivered < 100.0 && doc.status != 'Closed'"}
    - {name: make_sales_invoice, label: Create Sales Invoice, docstatus: [1], permission: read, condition: "doc.per_billed < 100.0 && doc.status != 'Closed'"}
    - name: update_items
      label: Update Items
      docstatus: [1]
      permission: submit
      params:
        - {name: line, type: int, label: Line, description: "The line to change, as numbered on the order. Empty to add a line"}
        - {name: item, type: link, to: Item, label: Item, description: "For a line added: the item, or empty for a line described below"}
        - {name: description, type: text, label: Description, description: "For a line added without an item: what it is"}
        - {name: qty, type: data, label: Quantity, description: "The line's new quantity, never below what was delivered or billed on it. 0 removes a line with nothing delivered or billed"}
        - {name: price, type: data, label: Price, description: "For a line without an item: its new price, for what is not yet billed. Items take theirs from the price list and pricing rules"}
        - {name: delivery_date, type: date, label: Delivery Date, description: "Moves the order's delivery date, and its lines' that had it"}
    - {name: close, label: Close, docstatus: [1], permission: submit, condition: "doc.status != 'Closed'"}
    - {name: reopen, label: Re-open, docstatus: [1], permission: submit, condition: "doc.status == 'Closed'"}
    - {name: reserve_stock, label: Reserve Stock, docstatus: [1], permission: submit, condition: "doc.status != 'Closed' && doc.per_delivered < 100.0"}
    - {name: release_stock, label: Release Reservation, docstatus: [1], permission: submit, condition: "doc.status != 'Closed'"}
  list: {columns: [number, customer_name, posting_date, grand_total, status], sort: posting_date desc}

- name: DeliveryNoteItem
  label: Delivery Note Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
