    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: price_list_rate, type: currency, read_only: true}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: promotion_percent, type: data, hidden: true, label: Promotions' Share,
       description: "The exact share of the line's amount promotions take off (after its own discount), kept as text so a return gives back the same share"}
    - {name: added_by_promotion, type: link, to: Promotion, hidden: true, label: Added By Promotion, description: "A free item a promotion added"}
    - {name: rate, type: currency, read_only: true, in_list: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, in_list: true}
    - {name: sales_order, type: link, to: SalesOrder, read_only: true}
    - {name: so_line, type: data, read_only: true}
    - {name: billed_qty, type: decimal, read_only: true, no_copy: true}
    - {name: returned_qty, type: decimal, read_only: true, no_copy: true, label: Returned Qty, description: What the returns against this delivery took back}
    - {name: return_line, type: data, read_only: true, hidden: true, no_copy: true, label: Original Line}
    - {name: valuation_rate, type: currency, read_only: true, no_copy: true}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: tax_categories, type: json, read_only: true, description: "Each tax account's category and exemption reason for the line"}

- name: DeliveryNote
  label: Delivery Note
  kind: document
  module: selling
  submittable: true
  company_scoped: true
  title_field: customer_name
  numbering: {template: "DN-{FY}-{seq:5}", on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: number_series, type: link, to: NumberSeries, no_copy: true, label: Numbering Series, in_filter: true,
       description: "The series this document is numbered from when it is submitted: one of those set up for it (a tax invoice, a branch). Empty: the series the company's settings or its country's rules give, else the usual one"}
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: posting_time, type: data, default_expr: time, description: "HH:MM:SS, local time (orders documents of the same day)"}
    - {name: is_return, type: check, in_filter: true}
    - {name: return_against, type: link, to: DeliveryNote, visible_if: "doc.is_return"}
    - {name: customer_address, type: link, to: Address, label: Billing Address, description: "The customer's; their primary billing address when empty"}
    - {name: ship_to, type: link, to: Address, label: Ship To, description: "Where the goods go: the customer's primary shipping address when empty. Countries' tax rules read its country and region"}
    - {name: delivery_country, type: data, label: Delivery Country, description: "Where the goods go when there is no ship-to address: a country name or ISO code, kept as the code. Follows the ship-to address when there is one"}
    - {name: delivery_region, type: data, label: Delivery Region, description: "The state, province or region the goods go, as countries' tax rules read it. Follows the ship-to address when there is one"}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: price_list, type: link, to: PriceList}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: DeliveryNoteItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: total, type: currency, read_only: true}
    - {name: net_total, type: currency, read_only: true}
    - {name: total_taxes, type: currency, read_only: true}
    - {name: grand_total, type: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, read_only: true}
    - {name: rounded_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: per_billed, type: percent, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, To Bill, Completed, Return, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: transporter, type: data}
    - {name: vehicle_no, type: data}
    - {name: print_prices, type: check, label: Show Prices on the Print, no_copy: true,
       description: "A delivery note prints without prices, as it travels with the goods; tick to print rates and amounts on it"}
    - {name: credit_release_reason, type: data, perm_group: credit, no_copy: true, label: Credit Release Reason,
       description: "Lets this delivery through over the customer's credit limit; filled in by someone allowed to release credit, and kept"}
  actions:
    - {name: make_sales_invoice, label: Create Sales Invoice, docstatus: [1], permission: read, condition: "doc.per_billed < 100.0 && !doc.is_return"}
    - {name: make_sales_return, label: Create Return, docstatus: [1], permission: read, condition: "!doc.is_return"}
    - {name: make_carrier_shipment, label: Ship by Carrier, docstatus: [1], permission: read, condition: "!doc.is_return",
       params: [{name: carrier, type: link, to: CarrierConnection, label: Carrier, description: "The company's only enabled connection when empty"},
                {name: weight, label: Weight, required: true, description: "Of the first parcel, in the connection's weight unit; add more parcels on the shipment"},
                {name: length, label: Length}, {name: width, label: Width}, {name: height, label: Height}]}
  list: {columns: [number, customer_name, posting_date, grand_total, status], sort: posting_date desc}

- name: SalesInvoiceItem
  label: Sales Invoice Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true, description: "Empty for a line booked straight to an account: rent, a fee, a one-off charge, described below"}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, description: "The item's name, or the line's description when it has no item"}
    - {name: description, type: text, description: "What the line is; needed on a line without an item"}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, in_list: true}
    - {name: conversion_factor, type: decimal, read_only: true, label: Stock Units per Unit}
    - {name: stock_qty, type: decimal, read_only: true, label: Qty in Stock Unit}
    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: price_list_rate, type: currency, read_only_if: "doc.item != null", description: "From the price list for an item; entered for a line without one"}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: promotion_percent, type: data, hidden: true, label: Promotions' Share,
       description: "The exact share of the line's amount promotions take off (after its own discount), kept as text so a return gives back the same share"}
    - {name: added_by_promotion, type: link, to: Promotion, hidden: true, label: Added By Promotion, description: "A free item a promotion added"}
    - {name: promotion_returned, type: json, hidden: true, read_only: true, no_copy: true, label: Promotions Given Back,
       description: "What credit notes gave back of the promotions on this line so far: the quantity and the amount per promotion, so the last part returned takes exactly what is left"}
    - {name: rate, type: currency, read_only: true, in_list: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: base_net_amount, type: currency, read_only: true}
    - {name: income_account, type: link, to: Account, link_filters: {is_group: false}}
    - {name: enable_deferred_revenue, type: check, label: Deferred Revenue, description: "Recognised day by day over the service period; a line added with its service period is deferred as its item is"}
    - {name: service_start_date, type: date}
    - {name: service_end_date, type: date}
    - {name: deferred_revenue_account, type: link, to: Account, link_filters: {is_group: false}, description: "Where it waits; the company's default deferred revenue account when empty"}
    - {name: deferred_booked, type: currency, read_only: true, no_copy: true, label: Recognised So Far}
    - {name: deferred_booked_till, type: date, read_only: true, no_copy: true, label: Recognised Through}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: dimensions, type: json, description: "Its accounting dimensions by code, e.g. {\"department\": \"Sales\"}, over the invoice's"}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: sales_order, type: link, to: SalesOrder, read_only: true}
    - {name: so_line, type: data, read_only: true}
    - {name: delivery_note, type: link, to: DeliveryNote, read_only: true}
    - {name: dn_line, type: data, read_only: true}
    - {name: returned_qty, type: decimal, read_only: true, no_copy: true, label: Returned Qty, description: What the credit notes against this invoice took back}
    - {name: credited_amount, type: currency, currency: parent.currency, read_only: true, no_copy: true, label: Credited, description: "What the credit notes against this invoice gave back on the line, before tax"}
    - {name: return_line, type: data, read_only: true, hidden: true, no_copy: true, label: Original Line}
    - {name: incoming_rate, type: currency, min: "0", no_copy: true, label: Cost of Goods Returned,
       description: "Per stock unit, for goods a credit note without an original invoice takes back into stock; their current valuation when empty"}
    - {name: valuation_rate, type: currency, read_only: true, no_copy: true}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: tax_categories, type: json, read_only: true, description: "Each tax account's category and exemption reason for the line"}
    - {name: carrier_shipment, type: link, to: CarrierShipment, read_only: true, no_copy: true, label: Carrier Shipment, description: "The label cost this line charges"}
    - {name: stored_value_kind, type: link, to: StoredValueKind, read_only: true, label: Stored Value, description: "Its item sells stored value of this kind"}
    - {name: stored_value_account, type: link, to: StoredValueAccount, label: Top Up Account, no_copy: true, visible_if: "doc.stored_value_kind != null",
       description: "An account to load; empty, the line opens a new one when the invoice is submitted"}
    - {name: stored_value_code, type: data, label: Card Code, no_copy: true, visible_if: "doc.stored_value_kind != null && doc.stored_value_account == null",
       description: "The new card's own code, typed or scanned; kept only as its last four characters. Empty: one is made, which the account's New Code shows"}
    - {name: stored_value_pin, type: data, label: Card PIN, no_copy: true, visible_if: "doc.stored_value_kind != null && doc.stored_value_account == null", description: "Never kept as typed"}
    - {name: stored_value_secret, type: data, read_only: true, hidden: true, no_copy: true}

- name: SalesInvoice
  label: Sales Invoice
  kind: document
  module: selling
  submittable: true
  company_scoped: true
  title_field: customer_name
  numbering: {template: "SINV-{FY}-{seq:5}", gapless: true, on: submit, date_field: posting_date}
  search_fields: [po_no]
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: number_series, type: link, to: NumberSeries, no_copy: true, label: Numbering Series, in_filter: true,
       description: "The series this document is numbered from when it is submitted: one of those set up for it (a tax invoice, a branch). Empty: the series the company's settings or its country's rules give, else the usual one"}
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: customer_company, type: link, to: Company, fetch_from: customer.represents_company, read_only: true, label: Group Company, in_filter: true,
       description: "The group company the customer is: this sale is a purchase in that company's books"}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: posting_time, type: data, default_expr: time, description: "HH:MM:SS, local time (orders documents of the same day)"}
    - {name: due_date, type: date, in_list: true}
    - {name: is_return, type: check, label: Is Return (Credit Note), in_filter: true}
    - {name: return_against, type: link, to: SalesInvoice, visible_if: "doc.is_return"}
    - {name: price_only, type: check, label: Price Only (no goods come back), visible_if: "doc.is_return",
       description: "A credit of price alone: a lower price agreed after the sale, a rebate. Nothing comes back into stock"}
    - {name: return_reason, type: data, label: Reason, visible_if: "doc.is_return || doc.is_debit_note",
       description: "Why it is credited or charged: needed for a credit note without its original invoice (goodwill, a rebate, a correction from before these books)"}
    - {name: is_debit_note, type: check, label: Debit Note (supplementary invoice), in_filter: true, no_copy: true,
       description: "Charges more on an earlier invoice: a price increase, something charged short"}
    - {name: debit_note_against, type: link, to: SalesInvoice, label: Against Invoice, visible_if: "doc.is_debit_note", no_copy: true}
    - {name: customer_address, type: link, to: Address, label: Billing Address, description: "The customer's; their primary billing address when empty"}
    - {name: ship_to, type: link, to: Address, label: Ship To, description: "Where the goods go: the customer's primary shipping address when empty. Countries' tax rules read its country and region"}
    - {name: delivery_country, type: data, label: Delivery Country, description: "Where the goods go when there is no ship-to address: a country name or ISO code, kept as the code. Follows the ship-to address when there is one"}
    - {name: delivery_region, type: data, label: Delivery Region, description: "The state, province or region the goods go, as countries' tax rules read it. Follows the ship-to address when there is one"}
    - {name: update_stock, type: check, description: Deliver stock with this invoice}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, visible_if: "doc.update_stock"}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: price_list, type: link, to: PriceList}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: SalesInvoiceItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: tax_breakdown, type: table, of: TaxBreakdown, read_only: true, label: Tax Breakdown}
    - {name: withholding_category, type: link, to: WithholdingCategory, label: Withholding Category, description: "Over every line's own: empty, each line takes its item's, else the customer's"}
    - {name: withholdings, type: table, of: WithholdingLine, read_only: true, label: Withholding}
    - {name: withholding_amount, type: currency, currency: currency, read_only: true, label: Collected, description: "Added to what the customer owes and booked to the category's account"}
    - {name: discount_percent, type: percent, min: "0", max: "100", label: Additional Discount %}
    - {name: channel, type: data, label: Channel, description: "Where the sale is made (Web Shop, Point of Sale, ...), as promotions name it; empty: this document's kind"}
    - {name: promotion_codes, type: data, label: Promotion Codes, no_copy: true, description: "Codes the customer gives, separated by commas or spaces"}
    - {name: applied_promotions, type: table, of: AppliedPromotion, read_only: true, no_copy: true, label: Promotions Applied}
    - {name: given_promotions, type: json, hidden: true, no_copy: true, label: Promotions an App Applied,
       description: "What an app that priced the sale itself (a till) says it applied: {snapshot, source, counted, at, applied: [{promotion, line, amount, code}]}. Checked against the promotion records, then kept in Promotions Applied; the lines are not discounted again"}
    - {name: tax_registrations, type: json, read_only: true, no_copy: true, label: Tax Registrations,
       description: "The seller's and the buyer's tax registrations (label and value) and whether the buyer is a registered business, as the countries' add-ons say, kept as the draft was last priced"}
    - {name: total, type: currency, currency: currency, read_only: true}
    - {name: discount_amount, type: currency, currency: currency, read_only: true}
    - {name: net_total, type: currency, currency: currency, read_only: true}
    - {name: total_taxes, type: currency, currency: currency, read_only: true}
    - {name: grand_total, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, currency: currency, read_only: true}
    - {name: rounded_total, type: currency, currency: currency, read_only: true}
    - {name: base_net_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: base_rounded_total, type: currency, read_only: true}
    - {name: outstanding_amount, type: currency, currency: currency, read_only: true, no_copy: true, in_list: true}
    - {name: debit_noted, type: currency, currency: currency, read_only: true, no_copy: true, label: Debit Notes, description: What the debit notes against this invoice charged on top}
    - {name: debit_to, type: link, to: Account, read_only: true, label: Receivable Account}
    - {name: status, type: select, options: [Draft, Unpaid, Partly Paid, Paid, Return, Credit Note Issued, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: po_no, type: data, label: Customer PO No}
    - {name: project, type: link, to: Project}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: dimensions, type: json, description: "Accounting dimensions by code for every line it books, each line's own over these"}
    - {name: terms, type: text}
    - {name: remarks, type: text}
    - {name: credit_release_reason, type: data, perm_group: credit, no_copy: true, label: Credit Release Reason,
       description: "Lets this invoice through over the customer's credit limit; filled in by someone allowed to release credit, and kept"}
  form:
    - {label: Invoice, fields: [company, customer, customer_name, posting_date, posting_time, due_date, po_no, is_return, return_against, price_only, is_debit_note, debit_note_against, return_reason]}
    - {label: Addresses, collapsible: true, fields: [customer_address, ship_to, delivery_country, delivery_region]}
    - {label: Currency & Price, collapsible: true, fields: [currency, conversion_rate, price_list, update_stock, set_warehouse]}
    - {label: Items, fields: [items]}
    - {label: Taxes, fields: [tax_template, taxes, tax_breakdown, discount_percent, withholding_category, withholdings, withholding_amount]}
    - {label: Promotions, collapsible: true, fields: [channel, promotion_codes, applied_promotions]}
    - {label: Totals, fields: [total, discount_amount, net_total, total_taxes, grand_total, rounding_adjustment, rounded_total, outstanding_amount, debit_noted, status]}
    - {label: More, collapsible: true, fields: [debit_to, base_net_total, base_grand_total, base_rounded_total, project, cost_center, terms, remarks, credit_release_reason]}
  rules:
    - {name: due_after_posting, check: "doc.due_date == null || doc.due_date >= doc.posting_date", message: "Due date cannot be before the posting date"}
    - {name: return_needs_source, check: "!doc.is_return || doc.return_against != null || (doc.return_reason != null && doc.return_reason != '')", on: submit,
       message: "A credit note without its original invoice needs a reason: goodwill, a rebate, a correction from before these books"}
    - {name: debit_note_needs_source, check: "!doc.is_debit_note || (doc.debit_note_against != null && !doc.is_return)", on: submit,
       message: "A debit note names the invoice it charges more on, and is not a credit note"}
  actions:
    - {name: make_payment, label: Record Payment, docstatus: [1], permission: read, condition: "doc.outstanding_amount > 0.0"}
    - {name: make_refund, label: Refund, docstatus: [1], permission: read, condition: "doc.is_return && doc.outstanding_amount < 0.0",
       params: [{name: store_credit, label: Into New Store Credit, type: link, to: StoredValueKind,
                 description: "Refund onto a new account of this kind held by the customer, instead of money. Empty: back onto the stored value that paid the sale, when its kind says so, else in money"}]}
    - {name: make_credit_note, label: Create Credit Note, docstatus: [1], permission: read, condition: "!doc.is_return",
       params: [{name: credit_percent, type: data, label: Credit of Price Only (%),
                 description: "Empty: the goods come back, for what is still returnable. A figure (10): no goods come back, and that share of each line's price is credited"}]}
    - {name: make_debit_note, label: Create Debit Note, docstatus: [1], permission: read, condition: "!doc.is_return",
       params: [{name: charge_percent, type: data, label: Charge on the Price (%),
                 description: "Empty: the lines as invoiced, to change to what was charged short. A figure (5): that share of each line's price is charged on top"}]}
    - {name: make_inter_company_invoice, label: Create Purchase Invoice in the Group Company, docstatus: [1], permission: read, condition: "doc.customer_company != null && !doc.is_return"}
  list: {columns: [number, customer_name, posting_date, grand_total, outstanding_amount, status], sort: posting_date desc}

- name: AppliedPromotion
  label: Applied Promotion
  kind: child
  description: "What one promotion took off one line of the document: for its receipt, and summed by the promotions report"
  fields:
    - {name: promotion, type: link, to: Promotion, in_list: true}
    - {name: title, type: data, in_list: true}
    - {name: line, type: data, hidden: true, description: "The line's id"}
    - {name: amount, type: currency, in_list: true, description: "Taken off the line, in the document's currency"}
    - {name: code, type: data, in_list: true}
    - {name: source, type: data, hidden: true, description: "The app's own id for the sale, when an app passed the promotions: recorded on one submitted document only"}
    - {name: counted_elsewhere, type: check, hidden: true, description: "The app that passed it counted its use of the promotion and its code: ERP records it and counts nothing"}

- name: PromotionItem
  label: Promotion Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true}
    - {name: item_group, type: link, to: ItemGroup, in_list: true}
    - {name: qty, type: decimal, default: 1, min: "0", label: Units, in_list: true, description: "In a bundle: how many of the item it holds"}

- name: PromotionCustomer
  label: Promotion Customer
  kind: child
  fields:
    - {name: customer, type: link, to: Customer, in_list: true}
    - {name: customer_group, type: link, to: CustomerGroup, in_list: true}

- name: PromotionPlace
  label: Promotion Place
  kind: child
  fields:
    - {name: warehouse, type: link, to: Warehouse, in_list: true}
    - {name: place, type: data, in_list: true, description: "Another place an app names a sale by (a register's id): it fills the place on the sale"}

- name: Promotion
  label: Promotion
  kind: master
  module: selling
  title_field: title
  description: "A discount over a whole sale: when it applies, what it gives and how it combines. Each line's pricing rules come first; promotions then go by priority on what is left"
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, in_filter: true, description: "Empty: every company"}
    - {name: disabled, type: check, in_filter: true}
    - {name: priority, type: int, default: 1, min: 0, max: 100, in_list: true, description: "Higher applies first; each on what earlier ones left"}
    - {name: valid_from, type: date, in_list: true}
    - {name: valid_upto, type: date, in_list: true}
    - {name: weekdays, type: data, description: "Days it applies, as numbers from 1 (Monday) to 7 (Sunday), e.g. 6,7; empty: every day"}
    - {name: from_time, type: data, label: From Time, description: "HH:MM, in the company's time zone"}
    - {name: to_time, type: data, label: To Time, description: "HH:MM; before From Time, the hours run past midnight"}
    - {name: channels, type: data, description: "Where the sale is made, as documents name it (Sales Order, Sales Invoice, Web Shop, Point of Sale), separated by commas; empty: everywhere"}
    - {name: customers, type: table, of: PromotionCustomer, description: "Customers or customer groups; empty: every customer"}
    - {name: places, type: table, of: PromotionPlace, description: "Warehouses or places an app names; empty: everywhere"}
    - {name: requires_code, type: check, label: Needs a Code, description: "Applies only with one of its Promotion Codes"}
    - {name: max_uses, type: int, default: 0, min: 0, label: Uses Allowed, description: "Over all its codes, counted when a document is submitted; 0: no limit"}
    - {name: used_count, type: int, default: 0, read_only: true, no_copy: true, label: Used}
    - {name: first_order_only, type: check, label: First Order Only, description: "Only for a customer with no submitted order or invoice yet"}
    - {name: min_amount, type: currency, min: "0", label: Minimum Spend, description: "On the qualifying lines, after their own discounts"}
    - {name: min_qty, type: decimal, min: "0", label: Minimum Quantity, description: "Of the qualifying lines"}
    - {name: qualifying_items, type: table, of: PromotionItem, label: Qualifying Items, description: "What counts towards the minimums, what lines-only discounts take off and what is bought; empty: everything"}
    - {name: gives, type: select, required: true, in_list: true, options: [Percent Off the Document, Amount Off the Document, Percent Off Qualifying Lines, Amount Off Qualifying Lines, Buy and Get, Bundle Price, Free Delivery, Free Item]}
    - {name: percent, type: percent, min: "0", max: "100", visible_if: "doc.gives.startsWith('Percent') || (doc.gives == 'Buy and Get' && doc.get_at == 'Percent Off')"}
    - {name: amount, type: currency, min: "0", visible_if: "doc.gives.startsWith('Amount') || doc.gives == 'Bundle Price' || (doc.gives == 'Buy and Get' && doc.get_at == 'Price')",
       description: "The amount off, the bundle's price, or what each unit got costs; in the company's currency"}
    - {name: buy_qty, type: decimal, min: "0", label: Buy, visible_if: "doc.gives == 'Buy and Get'", description: "Units of the qualifying items"}
    - {name: get_qty, type: decimal, min: "0", label: Get, visible_if: "doc.gives == 'Buy and Get'"}
    - {name: get_items, type: table, of: PromotionItem, label: Got From, visible_if: "doc.gives == 'Buy and Get'", description: "Empty: the qualifying items"}
    - {name: get_at, type: select, options: [Free, Percent Off, Price], default: Free, label: Got At, visible_if: "doc.gives == 'Buy and Get'"}
    - {name: cheapest_first, type: check, default: 1, label: Cheapest Got First, visible_if: "doc.gives == 'Buy and Get'", description: "Unticked: the dearest first"}
    - {name: bundle_items, type: table, of: PromotionItem, label: Bundle, visible_if: "doc.gives == 'Bundle Price'"}
    - {name: free_item, type: link, to: Item, visible_if: "doc.gives == 'Free Item'", required_if: "doc.gives == 'Free Item'"}
    - {name: free_qty, type: decimal, default: 1, min: "0", label: Free Quantity, visible_if: "doc.gives == 'Free Item'"}
    - {name: combinable, type: check, default: 1, label: Combines With Other Promotions, description: "Unticked: it applies only if none has yet, and then alone"}
    - {name: with_line_discounts, type: check, default: 1, label: Also On Discounted Lines, description: "Unticked: lines with a discount of their own (a pricing rule's) neither count nor are discounted"}
    - {name: max_discount, type: currency, min: "0", label: Most Taken Off, description: "On one document, in the company's currency; empty: no cap"}
  list: {columns: [title, gives, priority, valid_from, valid_upto], sort: priority desc}

- name: PromotionCode
  label: Promotion Code
  kind: master
  module: selling
  title_field: code
  description: "A code that opens a promotion: one shared code, or many unique ones, each with its own limit"
  fields:
    - {name: code, type: data, required: true, unique: true, in_list: true, description: "Letters, digits, '-' or '_'; kept in capitals"}
    - {name: promotion, type: link, to: Promotion, required: true, in_list: true, in_filter: true}
    - {name: max_uses, type: int, default: 0, min: 0, label: Uses Allowed, description: "Counted when a document using it is submitted, given back when it is cancelled; 0: no limit"}
    - {name: used_count, type: int, default: 0, read_only: true, no_copy: true, label: Used, in_list: true}
    - {name: disabled, type: check, in_filter: true}
