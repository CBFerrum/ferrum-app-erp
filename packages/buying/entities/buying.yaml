- name: PurchaseOrderItem
  label: Purchase Order Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true, description: "Empty for a line that is not an item: a service, a fee, a one-off charge, described below"}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, description: "The item's name, or the line's description when it has no item"}
    - {name: description, type: text, description: "What the line is; needed on a line without an item"}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: conversion_factor, type: decimal, read_only: true, label: Stock Units per Unit}
    - {name: stock_qty, type: decimal, read_only: true, label: Qty in Stock Unit}
    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: price_list_rate, type: currency, min: "0", in_list: true, description: Agreed unit price}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: rate, type: currency, read_only: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: schedule_date, type: date, label: Required By}
    - {name: received_qty, type: decimal, read_only: true, no_copy: true, in_list: true, description: "Above the quantity when more was received, within the over-receipt allowance"}
    - {name: billed_qty, type: decimal, read_only: true, no_copy: true}
    - {name: closed_qty, type: decimal, read_only: true, no_copy: true, label: Closed Short, description: "What was still open on the line when the order was closed: never received or billed"}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: tax_categories, type: json, read_only: true, description: "Each tax account's category and exemption reason for the line"}

- name: PurchaseOrder
  label: Purchase Order
  kind: document
  module: buying
  submittable: true
  company_scoped: true
  title_field: supplier_name
  numbering: {template: "PO-{FY}-{seq:5}", on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: supplier, type: link, to: Supplier, required: true, in_filter: true}
    - {name: supplier_name, type: data, fetch_from: supplier.supplier_name, read_only: true, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, label: Order Date, in_list: true, in_filter: true}
    - {name: schedule_date, type: date, label: Required By}
    - {name: supplier_address, type: link, to: Address, label: Supplier Address, description: "The supplier's; their primary billing address when empty"}
    - {name: ship_to, type: link, to: Address, label: Ship To, description: Where the goods are delivered}
    - {name: delivery_country, type: data, label: Delivery Country, description: "Where the goods are received when there is no ship-to address: a country name or ISO code, kept as the code. Follows the ship-to address when there is one"}
    - {name: delivery_region, type: data, label: Delivery Region, description: "The state, province or region the goods are received, as countries' tax rules read it. Follows the ship-to address when there is one"}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: PurchaseOrderItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: total, type: currency, read_only: true}
    - {name: net_total, type: currency, read_only: true}
    - {name: total_taxes, type: currency, read_only: true}
    - {name: grand_total, type: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, read_only: true}
    - {name: rounded_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: per_received, type: percent, read_only: true, no_copy: true}
    - {name: per_billed, type: percent, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, To Receive and Bill, To Receive, To Bill, Completed, Closed, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: project, type: link, to: Project}
    - {name: terms, type: text}
  actions:
    - {name: make_purchase_receipt, label: Create Purchase Receipt, docstatus: [1], permission: read, condition: "doc.per_received < 100.0 && doc.status != 'Closed'"}
    - {name: make_purchase_invoice, label: Create Purchase Invoice, docstatus: [1], permission: read, condition: "doc.per_billed < 100.0 && doc.status != 'Closed'"}
    - name: update_items
      label: Update Items
      docstatus: [1]
      permission: submit
      params:
        - {name: line, type: int, label: Line, description: "The line to change, as numbered on the order. Empty to add a line"}
        - {name: item, type: link, to: Item, label: Item, description: "For a line added: the item, or empty for a line described below"}
        - {name: description, type: text, label: Description, description: "For a line added without an item: what it is"}
        - {name: qty, type: data, label: Quantity, description: "The line's new quantity, never below what was received or billed on it. 0 removes a line with nothing received or billed"}
        - {name: price, type: data, label: Price, description: "The line's new agreed price, for what is not yet billed"}
        - {name: schedule_date, type: date, label: Required By, description: "Moves the order's required-by date, and its lines' that had it"}
    - {name: close, label: Close, docstatus: [1], permission: submit, condition: "doc.status != 'Closed'"}
    - {name: reopen, label: Re-open, docstatus: [1], permission: submit, condition: "doc.status == 'Closed'"}
  list: {columns: [number, supplier_name, posting_date, grand_total, status], sort: posting_date desc}

- name: PurchaseReceiptItem
  label: Purchase Receipt Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: conversion_factor, type: decimal, read_only: true, label: Stock Units per Unit}
    - {name: stock_qty, type: decimal, read_only: true, label: Qty in Stock Unit}
    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: rejected_qty, type: decimal, default: 0, min: "0"}
    - {name: price_list_rate, type: currency, min: "0", in_list: true}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: rate, type: currency, read_only: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, in_list: true}
    - {name: purchase_order, type: link, to: PurchaseOrder, read_only: true}
    - {name: po_line, type: data, read_only: true}
    - {name: billed_qty, type: decimal, read_only: true, no_copy: true}
    - {name: returned_qty, type: decimal, read_only: true, no_copy: true, label: Returned Qty, description: What the returns against this receipt sent back}
    - {name: return_line, type: data, read_only: true, hidden: true, no_copy: true, label: Original Line}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: tax_categories, type: json, read_only: true, description: "Each tax account's category and exemption reason for the line"}

- name: PurchaseReceipt
  label: Purchase Receipt
  kind: document
  module: buying
  submittable: true
  company_scoped: true
  title_field: supplier_name
  numbering: {template: "PR-{FY}-{seq:5}", on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: supplier, type: link, to: Supplier, required: true, in_filter: true}
    - {name: supplier_name, type: data, fetch_from: supplier.supplier_name, read_only: true, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: posting_time, type: data, default_expr: time, description: "HH:MM:SS, local time (orders documents of the same day)"}
    - {name: supplier_delivery_note, type: data}
    - {name: is_return, type: check, in_filter: true}
    - {name: return_against, type: link, to: PurchaseReceipt, visible_if: "doc.is_return"}
    - {name: supplier_address, type: link, to: Address, label: Supplier Address, description: "The supplier's; their primary billing address when empty"}
    - {name: ship_to, type: link, to: Address, label: Ship To, description: Where the goods are delivered}
    - {name: delivery_country, type: data, label: Delivery Country, description: "Where the goods are received when there is no ship-to address: a country name or ISO code, kept as the code. Follows the ship-to address when there is one"}
    - {name: delivery_region, type: data, label: Delivery Region, description: "The state, province or region the goods are received, as countries' tax rules read it. Follows the ship-to address when there is one"}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: PurchaseReceiptItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: total, type: currency, read_only: true}
    - {name: net_total, type: currency, read_only: true}
    - {name: total_taxes, type: currency, read_only: true}
    - {name: grand_total, type: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, read_only: true}
    - {name: rounded_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: per_billed, type: percent, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, To Bill, Completed, Return, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
  actions:
    - {name: make_purchase_invoice, label: Create Purchase Invoice, docstatus: [1], permission: read, condition: "doc.per_billed < 100.0 && !doc.is_return"}
    - {name: make_purchase_return, label: Create Return, docstatus: [1], permission: read, condition: "!doc.is_return"}
  list: {columns: [number, supplier_name, posting_date, grand_total, status], sort: posting_date desc}

- name: PurchaseInvoiceItem
  label: Purchase Invoice Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true, description: "Empty for a line booked straight to an account: rent, electricity, a consultant's fee, described below"}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, description: "The item's name, or the line's description when it has no item"}
    - {name: description, type: text, description: "What the line is; needed on a line without an item"}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, in_list: true}
    - {name: conversion_factor, type: decimal, read_only: true, label: Stock Units per Unit}
    - {name: stock_qty, type: decimal, read_only: true, label: Qty in Stock Unit}
    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: price_list_rate, type: currency, min: "0", in_list: true}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: rate, type: currency, read_only: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: base_net_amount, type: currency, read_only: true}
    - {name: expense_account, type: link, to: Account, link_filters: {is_group: false}}
    - {name: enable_deferred_expense, type: check, label: Deferred Expense, description: "Recognised day by day over the service period; a line added with its service period is deferred as its item is"}
    - {name: service_start_date, type: date}
    - {name: service_end_date, type: date}
    - {name: deferred_expense_account, type: link, to: Account, link_filters: {is_group: false}, description: "Where it waits; the company's default deferred expense account when empty"}
    - {name: deferred_booked, type: currency, read_only: true, no_copy: true, label: Recognised So Far}
    - {name: deferred_booked_till, type: date, read_only: true, no_copy: true, label: Recognised Through}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: purchase_order, type: link, to: PurchaseOrder, read_only: true}
    - {name: po_line, type: data, read_only: true}
    - {name: purchase_receipt, type: link, to: PurchaseReceipt, read_only: true}
    - {name: pr_line, type: data, read_only: true}
    - {name: returned_qty, type: decimal, read_only: true, no_copy: true, label: Returned Qty, description: What the debit notes against this invoice sent back}
    - {name: credited_amount, type: currency, currency: parent.currency, read_only: true, no_copy: true, label: Debited, description: "What the debit notes against this invoice took back on the line, before tax"}
    - {name: return_line, type: data, read_only: true, hidden: true, no_copy: true, label: Original Line}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}
    - {name: item_tax_rates, type: json, read_only: true}
    - {name: tax_categories, type: json, read_only: true, description: "Each tax account's category and exemption reason for the line"}

- name: PurchaseInvoice
  label: Purchase Invoice
  kind: document
  module: buying
  submittable: true
  company_scoped: true
  title_field: supplier_name
  numbering: {template: "PINV-{FY}-{seq:5}", on: submit, date_field: posting_date}
  search_fields: [bill_no]
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: supplier, type: link, to: Supplier, required: true, in_filter: true}
    - {name: supplier_name, type: data, fetch_from: supplier.supplier_name, read_only: true, in_list: true}
    - {name: bill_no, type: data, label: Supplier Invoice No, required: true, in_list: true}
    - {name: bill_date, type: date, label: Supplier Invoice Date}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: posting_time, type: data, default_expr: time, description: "HH:MM:SS, local time (orders documents of the same day)"}
    - {name: due_date, type: date, in_list: true}
    - {name: is_return, type: check, label: Is Return (Debit Note), in_filter: true}
    - {name: return_against, type: link, to: PurchaseInvoice, visible_if: "doc.is_return"}
    - {name: price_only, type: check, label: Price Only (no goods go back), visible_if: "doc.is_return",
       description: "A debit of price alone: a lower price agreed after the purchase, a rebate. Nothing leaves stock"}
    - {name: return_reason, type: data, label: Reason, visible_if: "doc.is_return",
       description: "Why it is debited: needed for a debit note without its original invoice (a rebate, a correction from before these books)"}
    - {name: supplier_address, type: link, to: Address, label: Supplier Address, description: "The supplier's; their primary billing address when empty"}
    - {name: ship_to, type: link, to: Address, label: Ship To, description: Where the goods are delivered}
    - {name: delivery_country, type: data, label: Delivery Country, description: "Where the goods are received when there is no ship-to address: a country name or ISO code, kept as the code. Follows the ship-to address when there is one"}
    - {name: delivery_region, type: data, label: Delivery Region, description: "The state, province or region the goods are received, as countries' tax rules read it. Follows the ship-to address when there is one"}
    - {name: update_stock, type: check, description: Receive stock with this invoice}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, visible_if: "doc.update_stock"}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: PurchaseInvoiceItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: tax_breakdown, type: table, of: TaxBreakdown, read_only: true, label: Tax Breakdown}
    - {name: withholding_category, type: link, to: WithholdingCategory, label: Withholding Category, description: "Over every line's own: empty, each line takes its item's, else the supplier's"}
    - {name: withholdings, type: table, of: WithholdingLine, read_only: true, label: Withholding}
    - {name: withholding_amount, type: currency, currency: currency, read_only: true, label: Withheld, description: "Deducted from what the supplier is owed and booked to the category's account"}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: total, type: currency, currency: currency, read_only: true}
    - {name: discount_amount, type: currency, currency: currency, read_only: true}
    - {name: net_total, type: currency, currency: currency, read_only: true}
    - {name: total_taxes, type: currency, currency: currency, read_only: true}
    - {name: grand_total, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, currency: currency, read_only: true}
    - {name: rounded_total, type: currency, currency: currency, read_only: true}
    - {name: base_net_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: base_rounded_total, type: currency, read_only: true}
    - {name: outstanding_amount, type: currency, currency: currency, read_only: true, no_copy: true, in_list: true}
    - {name: credit_to, type: link, to: Account, read_only: true, label: Payable Account}
    - {name: status, type: select, options: [Draft, Unpaid, Partly Paid, Paid, Return, Debit Note Issued, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: project, type: link, to: Project}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: remarks, type: text}
  rules:
    - {name: due_after_posting, check: "doc.due_date == null || doc.due_date >= doc.posting_date", message: "Due date cannot be before the posting date"}
    # An invoice made from an order or a receipt holds a draft's place with PENDING-<its number>.
    - {name: suppliers_own_number, check: "!doc.bill_no.startsWith('PENDING-')", on: submit,
       message: "Enter the supplier's own invoice number in Supplier Invoice No; the one filled in only held the draft's place"}
    - {name: return_needs_source, check: "!doc.is_return || doc.return_against != null || (doc.return_reason != null && doc.return_reason != '')", on: submit,
       message: "A debit note without its original invoice needs a reason: a rebate, a correction from before these books"}
  actions:
    - {name: make_payment, label: Record Payment, docstatus: [1], permission: read, condition: "doc.outstanding_amount > 0.0"}
    - {name: make_refund, label: Refund, docstatus: [1], permission: read, condition: "doc.is_return && doc.outstanding_amount < 0.0"}
    - {name: make_debit_note, label: Create Debit Note, docstatus: [1], permission: read, condition: "!doc.is_return",
       params: [{name: credit_percent, type: data, label: Debit of Price Only (%),
                 description: "Empty: the goods go back, for what is still returnable. A figure (10): no goods go back, and that share of each line's price is debited"}]}
  list: {columns: [number, supplier_name, bill_no, posting_date, grand_total, outstanding_amount, status], sort: posting_date desc}
