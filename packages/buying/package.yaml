package: buying
version: 0.1.0
label: Buying
description: Purchase orders, receipts and supplier invoices with three-way matching against orders and receipts.
depends: [accounting, inventory]

overlays:
  - entity: CarrierShipment
    ops:
      - {op: add_field, column: true, after: reference, field: {name: purchase_receipt, type: link, to: PurchaseReceipt, read_only: true, in_filter: true}}
  - entity: Item
    ops:
      - {op: add_field, column: true, after: is_stock_item, field: {name: is_purchased, type: check, default: true}}
      - {op: add_field, column: true, after: standard_rate, field: {name: last_purchase_rate, type: currency, read_only: true}}
      - {op: add_field, column: true, after: expense_account, field: {name: lead_time_days, type: int, default: 0, min: 0}}
      - {op: add_field, column: true, after: safety_stock, field: {name: min_order_qty, type: decimal, default: 0, min: "0"}}
      - {op: add_field, column: true, after: tax_rates, field: {name: suppliers, type: table, of: ItemSupplier, label: Approved Manufacturers / Suppliers}}

modules:
  - name: buying
    label: Buying
    icon: truck
    order: 50
    items: [PurchaseOrder, PurchaseReceipt, PurchaseInvoice, PaymentEntry, Supplier, PurchaseApprovalSettings, report:payables, report:statement_of_account, report:purchase_register]

roles:
  - name: Purchase User
    description: Day-to-day buying.
    permissions:
      - {entity: PurchaseOrder, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PurchaseReceipt, read: true, write: true, create: true, delete: true, submit: true, cancel: true}
      - {entity: PurchaseInvoice, read: true, write: true, create: true, delete: true}
      - {entity: Supplier, read: true, write: true, create: true}
      - {entity: Address, read: true}
      - {entity: SupplierGroup, read: true}
      - {entity: Item, read: true}
      - {entity: ItemGroup, read: true}
      - {entity: ItemPrice, read: true}
      - {entity: PriceList, read: true}
      - {entity: Warehouse, read: true}
      - {entity: Company, read: true}
      - {entity: Currency, read: true}
      - {entity: Uom, read: true}
      - {entity: TaxTemplate, read: true}
      - {entity: WithholdingCategory, read: true}
      - {entity: TaxRate, read: true}
      - {entity: Project, read: true}
      - {entity: CostCenter, read: true}
      - {entity: Account, read: true}
  - name: Purchase Manager
    permissions:
      - {entity: PurchaseOrder, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PurchaseReceipt, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PurchaseInvoice, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PurchaseApprovalSettings, read: true, write: true, create: true}
  - name: Accounts Manager
    permissions:
      - {entity: PurchaseInvoice, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PurchaseOrder, read: true}
      - {entity: PurchaseReceipt, read: true}

documents:
  - key: buying.serial_labels
    label: Serial number labels
    entity: PurchaseReceipt
    output: page
    languages:
      en:
        body: |-
          <style>@page {size: 50mm 25mm; margin: 2mm} .l {font: 8pt sans-serif; page-break-after: always}</style>
          {% for r in doc.items %}{% for sn in (r.serial_no or '')|split('\n') %}{% if sn|trim %}<div class="l"><b>{{ r.item_name }}</b>{{ barcode(sn|trim, module=1, height=40, text=true) }}</div>{% endif %}{% endfor %}{% endfor %}
