package: accounting
version: 0.3.0
label: Accounting
description: Universal journal (append-only, balanced in the database), payments with open-item allocation, period close, financial reports.
depends: [core, parties, products, project_records]
field_prefix: acc_

overlays:
  - entity: Company
    ops:
      - {op: add_field, column: true, after: fy_start_month, field: {name: rounding_mode, type: select, options: [Half Up, Half Even], default: Half Up}}
      - {op: add_field, column: true, after: rounding_mode, field: {name: round_total_to, type: decimal, description: "Cash rounding step for invoice totals, e.g. 1 (empty = off)"}}
      - {op: add_field, column: true, after: round_total_to, field: {name: default_cost_center, type: link, to: CostCenter}}
      - {op: add_field, column: true, after: default_cost_center, field: {name: default_receivable_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_receivable_account, field: {name: default_payable_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_payable_account, field: {name: default_income_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_income_account, field: {name: default_expense_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_expense_account, field: {name: default_deferred_revenue_account, type: link, to: Account, link_filters: {is_group: false}, description: "Where income earned over a service period waits until it is earned"}}
      - {op: add_field, column: true, after: default_deferred_revenue_account, field: {name: default_deferred_expense_account, type: link, to: Account, link_filters: {is_group: false}, description: "Where an expense for a service period waits until it is incurred"}}
      - {op: add_field, column: true, after: default_expense_account, field: {name: default_cash_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_cash_account, field: {name: default_bank_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_bank_account, field: {name: default_inventory_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_inventory_account, field: {name: cogs_account, type: link, to: Account, link_filters: {is_group: false}, label: Cost of Goods Sold Account}}
      - {op: add_field, column: true, after: cogs_account, field: {name: srbnb_account, type: link, to: Account, link_filters: {is_group: false}, label: Stock Received But Not Billed}}
      - {op: add_field, column: true, after: srbnb_account, field: {name: stock_adjustment_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: stock_adjustment_account, field: {name: round_off_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: round_off_account, field: {name: exchange_gain_loss_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: exchange_gain_loss_account, field: {name: retained_earnings_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: retained_earnings_account, field: {name: opening_balance_account, type: link, to: Account, link_filters: {is_group: false}, description: Offset for opening stock and balances}}
      - {op: add_field, column: true, after: opening_balance_account, field: {name: overhead_absorbed_account, type: link, to: Account, link_filters: {is_group: false}, label: Manufacturing Overheads Absorbed Account}}
      - {op: add_field, column: true, after: round_total_to, field: {name: tax_rounding, type: select, options: [Per Document, Per Line], default: Per Document,
          description: "Each tax worked out once on the document's lines together (EN 16931), or line by line and added up"}}
      - {op: add_field, column: true, after: overhead_absorbed_account, field: {name: parent_company, type: link, to: Company, label: Parent Company,
          description: "The group it reports to: a group's books are added up from the parent and every company under it"}}
      - {op: add_field, column: true, after: parent_company, field: {name: ownership_percent, type: percent, min: "0", max: "100", default: 100, label: Held by the Parent (%),
          description: "The share of this company its parent company holds; the rest is non-controlling interests in the group's books"}}
      # The letterhead and bank details printed on documents (print/ layouts of selling, buying, accounting, inventory).
      - {op: add_field, after: tax_id, field: {name: acc_address_line1, type: data, label: Address Line 1, description: "Printed at the top of every document; India's registered address is used where this is empty"}}
      - {op: add_field, after: acc_address_line1, field: {name: acc_address_line2, type: data, label: Address Line 2}}
      - {op: add_field, after: acc_address_line2, field: {name: acc_city, type: data, label: City, max_length: 80}}
      - {op: add_field, after: acc_city, field: {name: acc_region, type: data, label: State / Region, max_length: 80}}
      - {op: add_field, after: acc_region, field: {name: acc_postal_code, type: data, label: Postal Code, max_length: 20}}
      - {op: add_field, after: acc_postal_code, field: {name: acc_phone, type: phone, label: Phone}}
      - {op: add_field, after: acc_phone, field: {name: acc_email, type: email, label: E-mail}}
      - {op: add_field, after: acc_email, field: {name: acc_website, type: data, label: Website, max_length: 120}}
      - {op: add_field, after: acc_website, field: {name: acc_logo, type: attach, label: Logo, description: "An image (PNG, JPG or SVG) printed in the letterhead, uploaded to the company's files"}}
      - {op: add_field, after: acc_logo, field: {name: acc_bank_account_name, type: data, label: Account Name}}
      - {op: add_field, after: acc_bank_account_name, field: {name: acc_bank_name, type: data, label: Bank}}
      - {op: add_field, after: acc_bank_name, field: {name: acc_bank_account_no, type: data, label: Account No / IBAN, max_length: 40}}
      - {op: add_field, after: acc_bank_account_no, field: {name: acc_bank_branch_code, type: data, label: Branch / SWIFT / Routing Code, max_length: 40, description: "A branch, SWIFT/BIC, sort, routing or IFSC code, as customers need it to pay you"}}
      - {op: add_field, after: acc_bank_branch_code, field: {name: acc_print_terms, type: text, label: Default Terms, description: "Printed on invoices, orders and pro formas that carry no terms of their own"}}
      - {op: add_field, after: acc_print_terms, field: {name: acc_print_footer, type: text, label: Footer, description: "A line at the foot of every printed document: registration numbers, a thank-you, a reminder"}}
      - {op: add_section, after: fy_start_month, section: {label: Letterhead, collapsible: true, fields: [acc_address_line1, acc_address_line2, acc_city, acc_region, acc_postal_code, acc_phone, acc_email, acc_website, acc_logo]}}
      - {op: add_section, after: acc_logo, section: {label: Bank Details on Documents, collapsible: true, fields: [acc_bank_account_name, acc_bank_name, acc_bank_account_no, acc_bank_branch_code]}}
      - {op: add_section, after: acc_bank_branch_code, section: {label: Document Defaults, collapsible: true, fields: [acc_print_terms, acc_print_footer]}}
      - {op: add_action, action: {name: setup_chart_of_accounts, label: Create Standard Chart of Accounts, permission: write, confirm: 'Create the standard chart of accounts for this company, or add the standard accounts it lacks?'}}
      - {op: add_action, action: {name: post_opening_invoices, label: Post Opening Invoices, permission: write,
          confirm: "Post every draft opening invoice of this company against its Opening Balance Account? All are posted, or none if one is refused."}}
      - {op: add_action, action: {name: recognise_deferred, label: Recognise Deferred Revenue and Expense, permission: write, params: [{name: through, type: date, label: Through, description: "The last day to recognise; yesterday when empty"}]}}
  - entity: Customer
    ops:
      - {op: add_field, column: true, after: default_price_list, field: {name: receivable_account, type: link, to: Account, link_filters: {account_type: Receivable, is_group: false}, description: Overrides the company default}}
      - {op: add_field, column: true, after: receivable_account, field: {name: represents_company, type: link, to: Company, label: Represents Company,
          description: "This customer is one of the group's companies: what it owes and is owed cancels out when the group's books are added up"}}
      - {op: add_field, column: true, after: represents_company, field: {name: withholding_category, type: link, to: WithholdingCategory, label: Withholding Category, description: "What is collected on sales to this customer, unless an item or the invoice says otherwise"}}
  - entity: Supplier
    ops:
      - {op: add_field, column: true, after: default_price_list, field: {name: payable_account, type: link, to: Account, link_filters: {account_type: Payable, is_group: false}}}
      - {op: add_field, column: true, after: payable_account, field: {name: represents_company, type: link, to: Company, label: Represents Company,
          description: "This supplier is one of the group's companies: what it owes and is owed cancels out when the group's books are added up"}}
      - {op: add_field, column: true, after: represents_company, field: {name: withholding_category, type: link, to: WithholdingCategory, label: Withholding Category, description: "What is withheld from this supplier, unless an item or the document says otherwise"}}
  - entity: ItemGroup
    ops:
      - {op: add_field, column: true, after: is_group, field: {name: default_income_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_income_account, field: {name: default_expense_account, type: link, to: Account, link_filters: {is_group: false}}}
  - entity: Item
    ops:
      - {op: add_field, column: true, after: standard_rate, field: {name: income_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: income_account, field: {name: expense_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: expense_account, field: {name: enable_deferred_revenue, type: check, label: Deferred Revenue, description: "Sold for a service period: its income is recognised day by day over it, on lines that give the period"}}
      - {op: add_field, column: true, after: enable_deferred_revenue, field: {name: enable_deferred_expense, type: check, label: Deferred Expense, description: "Bought for a service period: its expense is recognised day by day over it, on lines that give the period"}}
      - {op: add_field, column: true, after: uoms, field: {name: tax_rates, type: table, of: ItemTaxRate, label: Item Tax Rates}}
      - {op: add_field, column: true, after: enable_deferred_expense, field: {name: withholding_category, type: link, to: WithholdingCategory, label: Withholding Category, description: "Its lines' withholding category, over the party's; a document's own category is over both"}}
      - {op: add_field, column: true, after: withholding_category, field: {name: stored_value_kind, type: link, to: StoredValueKind, label: Sells Stored Value,
          description: "Selling it issues or tops up an account of this kind (a gift card, store credit, a package): its lines go to the kind's liability, not to income"}}
      - {op: add_field, column: true, after: stored_value_kind, field: {name: stored_value_units, type: decimal, min: "0", label: Units Loaded, visible_if: "doc.stored_value_kind != null",
          description: "For a kind that holds units: how many one of it loads (a ten-session pack: 10)"}}

modules:
  - name: accounting
    label: Accounting
    icon: book
    order: 20
    items: [JournalEntry, JournalTemplate, PaymentEntry, PaymentInstrument, ModeOfPayment, BadDebtWriteOff, WriteOffReason, OpeningInvoice, Account, CostCenter, AccountingDimension, FinanceBook, FiscalYear, TaxTemplate, TaxRate, WithholdingCategory, WithholdingCertificate, StoredValueKind, StoredValueAccount, report:trial_balance, report:consolidated_trial_balance, report:general_ledger, report:deferred_revenue_and_expense,
            report:profit_and_loss, report:balance_sheet, report:cash_flow, report:receivables, report:payables, report:statement_of_account, report:tax_summary, TaxReturn, TaxReturnDefinition, report:tax_return_documents, report:withholding, report:stored_value_liability, report:stored_value_statement, report:stored_value_movement]
  - name: setup
    label: Setup
    icon: settings
    order: 90
    items: [Company, FiscalYear, Currency, ExchangeRate, Uom, CostCenter, Project, NumberSeries, PaymentApprovalSettings]
  - name: masters
    label: Masters
    icon: database
    order: 10
    items: [Customer, CustomerGroup, Supplier, SupplierGroup, Item, ItemGroup, Warehouse, PriceList, ItemPrice, Account, TaxTemplate]

# Approval before money leaves in a payment, by value band, as the package's default: off until the settings record's Ask
# for Approval is ticked (the steps then read "skipped" and the payment is submitted at once, as before). Payments to a
# supplier and refunds to a customer; receipts and transfers between the company's own accounts are not asked. The person
# who made the payment never approves it; payments an app makes as the system (a payment run's, whose own approval is
# the run's) go ahead; stand-ins and escalation are the platform's own.
approvals:
  - entity: PaymentEntry
    on: submit
    policy:
      system_bypass: true
      reset_on: [base_paid_amount]
      steps:
        - {label: Accounts Manager, approvers: {role: Accounts Manager},
           when: "settings.PaymentApprovalSettings.enabled && doc.payment_type != 'Internal Transfer' && (doc.payment_type == 'Pay') != doc.is_refund && doc.base_paid_amount > settings.PaymentApprovalSettings.first_above"}
        - {label: Two Accounts Managers, approvers: {role: Accounts Manager}, need: 2, not_earlier_deciders: true,
           when: "settings.PaymentApprovalSettings.enabled && doc.payment_type != 'Internal Transfer' && (doc.payment_type == 'Pay') != doc.is_refund && settings.PaymentApprovalSettings.second_above > 0.0 && doc.base_paid_amount > settings.PaymentApprovalSettings.second_above"}

roles:
