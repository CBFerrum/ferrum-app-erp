package: accounting
version: 0.3.0
label: Accounting
description: Universal journal (append-only, balanced in the database), payments with open-item allocation, period close, financial reports.
depends: [core, parties, products, project_records]

overlays:
  - entity: Company
    ops:
      - {op: add_field, column: true, after: fy_start_month, field: {name: rounding_mode, type: select, options: [Half Up, Half Even], default: Half Up}}
      - {op: add_field, column: true, after: rounding_mode, field: {name: round_total_to, type: decimal, description: "Cash rounding step for invoice totals, e.g. 1 (empty = off)"}}
      - {op: add_field, column: true, after: round_total_to, field: {name: default_cost_center, type: link, to: CostCenter}}
      - {op: add_field, column: true, after: default_cost_center, field: {name: default_receivable_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_receivable_account, field: {name: default_payable_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_payable_account, field: {name: default_income_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_income_account, field: {name: default_expense_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_expense_account, field: {name: default_deferred_revenue_account, type: link, to: Account, link_filters: {is_group: false}, description: "Where income earned over a service period waits until it is earned"}}
      - {op: add_field, column: true, after: default_deferred_revenue_account, field: {name: default_deferred_expense_account, type: link, to: Account, link_filters: {is_group: false}, description: "Where an expense for a service period waits until it is incurred"}}
      - {op: add_field, column: true, after: default_expense_account, field: {name: default_cash_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_cash_account, field: {name: default_bank_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_bank_account, field: {name: default_inventory_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_inventory_account, field: {name: cogs_account, type: link, to: Account, link_filters: {is_group: false}, label: Cost of Goods Sold Account}}
      - {op: add_field, column: true, after: cogs_account, field: {name: srbnb_account, type: link, to: Account, link_filters: {is_group: false}, label: Stock Received But Not Billed}}
      - {op: add_field, column: true, after: srbnb_account, field: {name: stock_adjustment_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: stock_adjustment_account, field: {name: round_off_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: round_off_account, field: {name: exchange_gain_loss_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: exchange_gain_loss_account, field: {name: retained_earnings_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: retained_earnings_account, field: {name: opening_balance_account, type: link, to: Account, link_filters: {is_group: false}, description: Offset for opening stock and balances}}
      - {op: add_field, column: true, after: opening_balance_account, field: {name: overhead_absorbed_account, type: link, to: Account, link_filters: {is_group: false}, label: Manufacturing Overheads Absorbed Account}}
      - {op: add_field, column: true, after: round_total_to, field: {name: tax_rounding, type: select, options: [Per Document, Per Line], default: Per Document,
          description: "Each tax worked out once on the document's lines together (EN 16931), or line by line and added up"}}
      - {op: add_field, column: true, after: overhead_absorbed_account, field: {name: parent_company, type: link, to: Company, label: Parent Company,
          description: "The group it reports to: a group's books are added up from the parent and every company under it"}}
      - {op: add_action, action: {name: setup_chart_of_accounts, label: Create Standard Chart of Accounts, permission: write, confirm: 'Create the standard chart of accounts for this company, or add the standard accounts it lacks?'}}
      - {op: add_action, action: {name: recognise_deferred, label: Recognise Deferred Revenue and Expense, permission: write, params: [{name: through, type: date, label: Through, description: "The last day to recognise; yesterday when empty"}]}}
  - entity: Customer
    ops:
      - {op: add_field, column: true, after: default_price_list, field: {name: receivable_account, type: link, to: Account, link_filters: {account_type: Receivable, is_group: false}, description: Overrides the company default}}
      - {op: add_field, column: true, after: receivable_account, field: {name: represents_company, type: link, to: Company, label: Represents Company,
          description: "This customer is one of the group's companies: what it owes and is owed cancels out when the group's books are added up"}}
  - entity: Supplier
    ops:
      - {op: add_field, column: true, after: default_price_list, field: {name: payable_account, type: link, to: Account, link_filters: {account_type: Payable, is_group: false}}}
      - {op: add_field, column: true, after: payable_account, field: {name: represents_company, type: link, to: Company, label: Represents Company,
          description: "This supplier is one of the group's companies: what it owes and is owed cancels out when the group's books are added up"}}
  - entity: ItemGroup
    ops:
      - {op: add_field, column: true, after: is_group, field: {name: default_income_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: default_income_account, field: {name: default_expense_account, type: link, to: Account, link_filters: {is_group: false}}}
  - entity: Item
    ops:
      - {op: add_field, column: true, after: standard_rate, field: {name: income_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: income_account, field: {name: expense_account, type: link, to: Account, link_filters: {is_group: false}}}
      - {op: add_field, column: true, after: expense_account, field: {name: enable_deferred_revenue, type: check, label: Deferred Revenue, description: "Sold for a service period: its income is recognised day by day over it"}}
      - {op: add_field, column: true, after: enable_deferred_revenue, field: {name: enable_deferred_expense, type: check, label: Deferred Expense, description: "Bought for a service period: its expense is recognised day by day over it"}}
      - {op: add_field, column: true, after: uoms, field: {name: tax_rates, type: table, of: ItemTaxRate, label: Item Tax Rates}}

modules:
  - name: accounting
    label: Accounting
    icon: book
    order: 20
    items: [JournalEntry, PaymentEntry, Account, CostCenter, FinanceBook, FiscalYear, TaxTemplate, TaxRate, report:trial_balance, report:consolidated_trial_balance, report:general_ledger, report:deferred_revenue_and_expense,
            report:profit_and_loss, report:balance_sheet, report:cash_flow, report:receivables, report:payables]
  - name: setup
    label: Setup
    icon: settings
    order: 90
    items: [Company, FiscalYear, Currency, ExchangeRate, Uom, CostCenter, Project]
  - name: masters
    label: Masters
    icon: database
    order: 10
    items: [Customer, CustomerGroup, Supplier, SupplierGroup, Item, ItemGroup, Warehouse, PriceList, ItemPrice, Account, TaxTemplate]

roles:
  - name: Accounts Manager
    description: Full access to finance masters and documents.
    permissions:
      - {entity: JournalEntry, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PaymentEntry, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: Company, read: true, write: true, create: true}
      - {entity: FiscalYear, read: true, write: true, create: true, delete: true}
      - {entity: Account, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: CostCenter, read: true, write: true, create: true, delete: true}
      - {entity: FinanceBook, read: true, write: true, create: true, delete: true}
      - {entity: Project, read: true, write: true, create: true, delete: true}
      - {entity: Currency, read: true, write: true, create: true}
      - {entity: ExchangeRate, read: true, write: true, create: true, delete: true, import: true}
      - {entity: TaxTemplate, read: true, write: true, create: true, delete: true}
      - {entity: TaxRate, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Customer, read: true, write: true, create: true, delete: true, export: true, import: true, read_groups: [credit], write_groups: [credit]}
      - {entity: CustomerGroup, read: true, write: true, create: true, delete: true}
      - {entity: Supplier, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: SupplierGroup, read: true, write: true, create: true, delete: true}
      - {entity: Item, read: true, export: true}
      - {entity: ItemGroup, read: true}
      - {entity: Warehouse, read: true}
      - {entity: Uom, read: true}
      - {entity: PriceList, read: true}
      - {entity: ItemPrice, read: true}
  - name: Accounts User
    description: Enters vouchers; a manager approves.
    permissions:
      - {entity: JournalEntry, read: true, write: true, create: true, delete: true, if_owner: false}
      - {entity: PaymentEntry, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: Account, read: true}
      - {entity: Company, read: true}
      - {entity: Customer, read: true}
      - {entity: Supplier, read: true}
      - {entity: CostCenter, read: true}
      - {entity: FinanceBook, read: true}
      - {entity: Project, read: true}
      - {entity: Currency, read: true}
export_tables: [accounting_period, journal_entry, journal_line, open_item, allocation]
merge_links:
  - {table: open_item, column: customer_id, to: Customer}
  - {table: open_item, column: supplier_id, to: Supplier}
