- name: FiscalYear
  label: Fiscal Year
  kind: master
  module: setup
  title_field: year_name
  company_scoped: true
  fields:
    - {name: year_name, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, in_list: true, in_filter: true}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, required: true, in_list: true}
  unique: [[company, year_name]]
  exclusion:
    - {fields: [company], from: start_date, to: end_date, message: Fiscal years of a company cannot overlap}
  rules:
    - {name: ordered_dates, check: "doc.end_date > doc.start_date", message: "End date must be after start date"}
  actions:
    - {name: close_period, label: Close Accounting Period, permission: write, confirm: "Close the selected month? Postings into it will be refused."}
    - {name: reopen_period, label: Reopen Accounting Period, permission: write}
  list: {sort: start_date desc}

- name: FinanceBook
  label: Finance Book
  kind: master
  module: accounting
  title_field: finance_book_name
  description: "Another set of books beside the common one, such as IFRS beside local rules or a tax book: its own entries adjust it alone, and it has every entry with no book besides. Assets keep a book's own values in it."
  fields:
    - {name: finance_book_name, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
  list: {columns: [finance_book_name], sort: finance_book_name asc}

- name: CostCenter
  label: Cost Center
  kind: master
  module: setup
  title_field: cost_center_name
  company_scoped: true
  fields:
    - {name: cost_center_name, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, in_filter: true}
    - {name: parent_cost_center, type: link, to: CostCenter, link_filters: {is_group: true}}
    - {name: is_group, type: check}
    - {name: disabled, type: check}
  unique: [[company, cost_center_name]]

- name: Account
  label: Account
  kind: master
  module: masters
  title_field: account_name
  company_scoped: true
  search_fields: [account_number]
  fields:
    - {name: account_name, type: data, required: true, in_list: true}
    - {name: account_number, type: data, in_list: true}
    - {name: company, type: link, to: Company, required: true, locked: true, in_filter: true}
    - {name: parent_account, type: link, to: Account, link_filters: {is_group: true}, in_filter: true}
    - {name: is_group, type: check, in_list: true, in_filter: true}
    - {name: root_type, type: select, options: [Asset, Liability, Equity, Income, Expense], required: true, locked: true, in_list: true, in_filter: true}
    - name: account_type
      type: select
      in_filter: true
      options: [Receivable, Payable, Bank, Cash, Stock, Cost of Goods Sold, Stock Received But Not Billed, Tax, Income, Expense,
                Round Off, Exchange Gain Loss, Stock Adjustment, Fixed Asset, Equity, Temporary]
    - {name: account_currency, type: link, to: Currency, description: Leave empty for company currency}
    - {name: cash_flow_section, type: select, options: [Operating, Investing, Financing], label: Cash Flow Section, description: "Where a change in this account shows in the cash flow statement. Empty: fixed assets are investing, equity is financing, everything else operating"}
    - {name: frozen, type: check, description: Frozen accounts refuse new postings}
    - {name: eliminate_in_consolidation, type: check, label: Eliminate in Consolidation, description: "Business between the group's companies (intercompany sales and costs, loans): its balance cancels out when the group's books are added up"}
    - {name: disabled, type: check}
  unique: [[company, account_name], [company, account_number]]
  rules:
    - {name: party_accounts_are_leaves, check: "!(doc.is_group && (doc.account_type == 'Receivable' || doc.account_type == 'Payable'))", message: "Receivable/Payable accounts cannot be groups"}
  list: {columns: [account_number, account_name, root_type, is_group], sort: account_number asc}

- name: ItemTaxRate
  label: Item Tax Rate
  kind: child
  fields:
    - {name: tax_account, type: link, to: Account, required: true, link_filters: {account_type: Tax}, in_list: true}
    - {name: rate, type: percent, required: true, min: "0", in_list: true, description: "The item's rate for this tax; for an On Item Quantity tax, the amount per stock unit"}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], in_list: true, description: "The item's tax category for this tax; its tax row's when empty"}
    - {name: exemption_reason, type: data, description: "Why it is exempt or zero-rated: a code (VATEX-EU-132-1I) or the law's words"}

- name: TaxRow
  label: Tax Row
  kind: child
  fields:
    - {name: charge_type, type: select, options: [On Net Total, On Previous Row Amount, On Previous Row Total, Actual, On Item Quantity], required: true, default: On Net Total, in_list: true,
       description: "On Item Quantity: the rate is an amount per stock unit (excise, eco and packaging fees)"}
    - {name: account, type: link, to: Account, required: true, link_filters: {is_group: false}, in_list: true}
    - {name: description, type: data, in_list: true}
    - {name: rate, type: percent, min: "0", in_list: true, description: "A percentage (at most 1000); for On Item Quantity, the amount per stock unit"}
    - {name: amount, type: currency, description: Fixed amount for Actual charges}
    - {name: row_ref, type: int, min: 1, label: Reference Row, description: For "previous row" charges (1-based)}
    - {name: included_in_price, type: check, label: Included in Rate}
    - {name: deduct, type: check, description: Withholding taxes are deducted}
    - {name: reverse_charge, type: check, description: "The buyer accounts for this tax: worked out and reported, never charged to the party. A purchase posts it to this row's account and to the reverse-charge account; a sale posts nothing"}
    - {name: reverse_charge_account, type: link, to: Account, link_filters: {is_group: false}, visible_if: "doc.reverse_charge", description: "Purchases: the tax owed account the reverse charge is credited to"}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], description: "For tax reports and e-invoices. When empty: Reverse Charge for a reverse charge, Standard above a zero rate, Zero Rated at zero"}
    - {name: exemption_reason, type: data, description: "Why it is exempt or zero-rated: a code (VATEX-EU-132-1I) or the law's words"}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: tax_amount, type: currency, read_only: true, in_list: true}
    - {name: total, type: currency, read_only: true, in_list: true}
    - {name: base_tax_amount, type: currency, read_only: true}
    - {name: base_total, type: currency, read_only: true}

# What an invoice's taxes come to per tax, category and rate (EN 16931's VAT breakdown, BG-23).
- name: TaxBreakdown
  label: Tax Breakdown
  kind: child
  fields:
    - {name: description, type: data, read_only: true, in_list: true}
    - {name: account, type: link, to: Account, read_only: true}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], read_only: true, in_list: true}
    - {name: rate, type: decimal, read_only: true, in_list: true, description: "A percentage, or an amount per stock unit for On Item Quantity taxes"}
    - {name: exemption_reason, type: data, read_only: true}
    - {name: reverse_charge, type: check, read_only: true}
    - {name: taxable_amount, type: currency, read_only: true, in_list: true}
    - {name: tax_amount, type: currency, read_only: true, in_list: true}
    - {name: base_taxable_amount, type: currency, read_only: true}
    - {name: base_tax_amount, type: currency, read_only: true}

- name: TaxTemplate
  label: Tax Template
  kind: master
  module: masters
  title_field: title
  company_scoped: true
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, in_filter: true}
    - {name: kind, type: select, options: [Sales, Purchase], required: true, in_list: true, in_filter: true}
    - {name: is_default, type: check, in_list: true}
    - {name: condition, type: code, description: "Optional CEL condition on the document, e.g. doc.place_of_supply == 'Karnataka'"}
    - {name: rows, type: table, of: TaxRow, required: true}
  unique: [[company, title]]

- name: TaxRate
  # A tax rate kept as data: from its first day it replaces the localization's built-in rate for
  # the category (a region's over the whole country's), so a new rate is a record, not a release.
  label: Tax Rate
  kind: master
  module: accounting
  title_field: category
  fields:
    - {name: country, type: data, required: true, max_length: 2, in_list: true, in_filter: true, description: "ISO 3166-1 alpha-2 code, e.g. SG"}
    - {name: region, type: data, max_length: 6, in_list: true, in_filter: true, description: "A state's or province's code (e.g. ON), or empty for the whole country"}
    - {name: category, type: data, required: true, max_length: 60, in_list: true, in_filter: true, description: "The localization's tax category, e.g. Standard or Reduced"}
    - {name: rate, type: percent, required: true, min: "0", in_list: true}
    - {name: valid_from, type: date, required: true, in_list: true}
    - {name: valid_to, type: date, in_list: true, description: "Empty: until a later rate for the category starts"}
    - {name: notes, type: text, description: "The law or notice it comes from"}
  unique: [[country, region, category, valid_from]]
  rules:
    - {name: country_code, check: "doc.country.matches('^[A-Z]{2}$')", message: "The country is its two capital letters (ISO 3166-1), e.g. SG"}
    - {name: at_most_100, check: "doc.rate <= 100.0", message: "A rate is at most 100%"}
    - {name: ends_after_start, check: "doc.valid_to == null || doc.valid_to >= doc.valid_from", message: "A rate cannot end before it starts"}
  list: {columns: [country, region, category, rate, valid_from, valid_to], sort: valid_from desc}

# Withholding by category (FN-28): what is withheld or collected, where it books, its dated rates
# and thresholds. A country's categories are records its add-on seeds; the engine knows none.
- name: WithholdingRate
  label: Withholding Rate
  kind: child
  fields:
    - {name: valid_from, type: date, required: true, in_list: true}
    - {name: rate, type: percent, required: true, min: "0", max: "100", in_list: true}
    - {name: single_threshold, type: currency, min: "0", in_list: true, label: Per Document Threshold,
       description: "A document whose base is above it is withheld on, whatever the year so far. Empty: none"}
    - {name: yearly_threshold, type: currency, min: "0", in_list: true, label: Yearly Threshold,
       description: "Once the party's base in the category this fiscal year goes above it, withholding starts. Empty: none"}

- name: WithholdingAccount
  label: Withholding Account
  kind: child
  fields:
    - {name: company, type: link, to: Company, required: true, in_list: true}
    - {name: account, type: link, to: Account, required: true, link_filters: {is_group: false}, in_list: true,
       description: "Where the company books what it withholds or collects: a liability it pays over"}

- name: WithholdingCategory
  label: Withholding Category
  label_plural: Withholding Categories
  kind: master
  module: accounting
  title_field: category_name
  description: "Tax a company withholds from what it pays a supplier, or collects on top of what it sells, by category: when it applies, on what, at which dated rates and above which thresholds."
  fields:
    - {name: category_name, type: data, required: true, unique: true, in_list: true}
    - {name: applies, type: select, options: [On Bill, On Payment, On Sale], required: true, default: On Bill, in_list: true, in_filter: true,
       description: "On Bill: deducted from a supplier's bill when it is booked (and from an advance paid before it). On Payment: deducted from what is paid against a bill, in proportion to the part paid, and from an advance. On Sale: collected from the customer on top of a sales invoice"}
    - {name: base, type: select, options: [Net Total, Grand Total], required: true, default: Net Total, in_list: true, label: Withheld On,
       description: "The lines' amount before taxes, or with their taxes"}
    - {name: cumulative_base, type: select, options: [Whole Year, Above Threshold], required: true, default: Whole Year, label: Once the Yearly Threshold Is Crossed,
       description: "Whole Year: the document that crosses it is withheld on its own base and on the year's earlier base that was not withheld on. Above Threshold: only on the part of the year's base above the threshold"}
    - {name: round_to_unit, type: check, label: Round to Whole Units, description: "Each amount withheld to a whole unit of the company's currency; to its smallest unit when not ticked"}
    - {name: rates, type: table, of: WithholdingRate, required: true}
    - {name: accounts, type: table, of: WithholdingAccount, label: Accounts, description: "One per company that withholds in this category"}
    - {name: account_number, type: data, label: Account Number, description: "For a company without a row above: its account with this number in its chart"}
    - {name: description, type: text, description: "The law or section it comes from"}
  list: {columns: [category_name, applies, base], sort: category_name asc}

- name: WithholdingCertificate
  label: Withholding Certificate
  kind: master
  module: accounting
  title_field: certificate_no
  description: "A party's exemption or lower rate in a category, for a period and up to a limit of base: within it the certificate's rate applies, beyond it the category's."
  fields:
    - {name: certificate_no, type: data, required: true, in_list: true}
    - {name: category, type: link, to: WithholdingCategory, required: true, in_list: true, in_filter: true}
    - {name: party_type, type: select, options: [Supplier, Customer], required: true, default: Supplier, in_list: true}
    - {name: supplier, type: link, to: Supplier, in_filter: true, visible_if: "doc.party_type == 'Supplier'", required_if: "doc.party_type == 'Supplier'"}
    - {name: customer, type: link, to: Customer, in_filter: true, visible_if: "doc.party_type == 'Customer'", required_if: "doc.party_type == 'Customer'"}
    - {name: valid_from, type: date, required: true, in_list: true}
    - {name: valid_to, type: date, in_list: true}
    - {name: rate, type: percent, required: true, min: "0", max: "100", in_list: true, description: "0 for an exemption"}
    - {name: limit, type: currency, min: "0", in_list: true, label: Limit, description: "The base it covers in all; empty: no limit"}
  unique: [[category, certificate_no]]
  rules:
    - {name: ends_after_start, check: "doc.valid_to == null || doc.valid_to >= doc.valid_from", message: "A certificate cannot end before it starts"}
  list: {columns: [certificate_no, category, party_type, rate, valid_from, valid_to], sort: valid_from desc}

# What a document withheld or collected in a category: filled by the engine, read by the report.
- name: WithholdingLine
  label: Withholding
  kind: child
  fields:
    - {name: category, type: link, to: WithholdingCategory, read_only: true, in_list: true}
    - {name: certificate, type: link, to: WithholdingCertificate, read_only: true, in_list: true}
    - {name: against, type: data, read_only: true, label: Against Invoice, description: "On a payment, the bill paid; empty for an advance"}
    - {name: against_number, type: data, read_only: true, in_list: true, label: Invoice}
    - {name: base, type: currency, read_only: true, in_list: true, description: "What this document adds to the party's base in the category, in company currency"}
    - {name: advance_base, type: currency, read_only: true, description: "On a bill, the part of its base already withheld on when advances were paid"}
    - {name: taxable, type: currency, read_only: true, in_list: true, label: Withheld On}
    - {name: rate, type: percent, read_only: true, in_list: true}
    - {name: amount, type: currency, read_only: true, in_list: true, description: "In company currency"}

# Accounting dimensions (FN-01): what a workspace analyses its books by beyond cost centre and
# project. A ledger line keeps its values as {code: value}; documents and their lines carry them in
# `dimensions`, a line's own over its document's.
- name: AccountingDimensionValue
  label: Dimension Value
  kind: child
  fields:
    - {name: value, type: data, required: true, max_length: 140, in_list: true}
    - {name: description, type: data, in_list: true}

- name: AccountingDimensionRequirement
  label: Required For
  kind: child
  fields:
    - {name: account, type: link, to: Account, link_filters: {is_group: false}, in_list: true}
    - name: account_type
      type: select
      in_list: true
      options: [Receivable, Payable, Bank, Cash, Stock, Cost of Goods Sold, Stock Received But Not Billed, Tax, Income, Expense,
                Round Off, Exchange Gain Loss, Stock Adjustment, Fixed Asset, Equity, Temporary]
    - {name: root_type, type: select, options: [Asset, Liability, Equity, Income, Expense], in_list: true}

- name: AccountingDimensionDefault
  label: Dimension Default
  kind: child
  fields:
    - {name: company, type: link, to: Company, in_list: true}
    - {name: cost_center, type: link, to: CostCenter, in_list: true}
    - {name: project, type: link, to: Project, in_list: true}
    - {name: customer, type: link, to: Customer, in_list: true}
    - {name: supplier, type: link, to: Supplier, in_list: true}
    - {name: item, type: link, to: Item, in_list: true}
    - {name: value, type: data, required: true, max_length: 140, in_list: true}

- name: AccountingDimension
  label: Accounting Dimension
  kind: master
  module: accounting
  title_field: dimension_name
  description: "Something the books are analysed by beyond cost centre and project (a department, a branch, a product line): its values, the accounts that need it on every line, and the value a line takes when it gives none. Every report filters and groups by it."
  fields:
    - {name: dimension_name, type: data, required: true, unique: true, in_list: true}
    - {name: code, type: data, required: true, unique: true, locked: true, max_length: 40, in_list: true,
       description: "What documents' dimensions and reports call it (department): lower-case letters, digits and _. cost_center and project are the dimensions every line already has"}
    - {name: source, type: select, options: [List, Records], required: true, default: List, in_list: true,
       description: "List: the values below. Records: the records of an entity (a branch, an employee, a territory), each value a record's id"}
    - {name: source_entity, type: data, label: Entity, max_length: 80, visible_if: "doc.source == 'Records'", required_if: "doc.source == 'Records'", description: "The entity its values are records of, e.g. Territory"}
    - {name: values, type: table, of: AccountingDimensionValue, visible_if: "doc.source == 'List'"}
    - {name: required_for, type: table, of: AccountingDimensionRequirement, label: Required For,
       description: "Every ledger line on these accounts, account types or root types needs a value"}
    - {name: defaults, type: table, of: AccountingDimensionDefault,
       description: "The value a line with none takes: the first row whose company, cost center, project, party and item all match the line's (an empty one matches any)"}
    - {name: disabled, type: check, in_filter: true, description: "Its values stay on the lines that have them; nothing needs it or defaults to it any more"}
  rules:
    - {name: code_form, check: "doc.code.matches('^[a-z][a-z0-9_]*$') && doc.code != 'cost_center' && doc.code != 'project'",
       message: "The code is lower-case letters, digits and _, starting with a letter, and not cost_center or project"}
  list: {columns: [dimension_name, code, source, disabled], sort: dimension_name asc}

# Tax returns as definitions (FN-38, FN-40): boxes summed from the tax each submitted invoice keeps
# in its tax breakdown, or worked out from other boxes; a country's return is a definition its
# add-on seeds, or an accountant makes.
- name: TaxReturnBoxDefinition
  label: Return Box
  kind: child
  fields:
    - {name: code, type: data, required: true, max_length: 20, in_list: true}
    - {name: label, type: data, in_list: true}
    - {name: kind, type: select, options: [Sum, Formula, By Hand], required: true, default: Sum, in_list: true,
       description: "Sum: of the tax ledger's rows that match. Formula: over other boxes' codes. By Hand: entered on each return"}
    - {name: measure, type: select, options: [Tax, Base], default: Tax, in_list: true, visible_if: "doc.kind == 'Sum'", description: "The tax, or the taxable base"}
    - {name: direction, type: select, options: [Any, Output, Input], default: Any, in_list: true, visible_if: "doc.kind == 'Sum'", description: "Output: sales. Input: purchases"}
    - {name: tax, type: data, visible_if: "doc.kind == 'Sum'", description: "Only this tax: its account's name or the tax row's description"}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], visible_if: "doc.kind == 'Sum'"}
    - {name: rate, type: decimal, visible_if: "doc.kind == 'Sum'", description: "Only this rate; any when empty"}
    - {name: reverse_charge, type: select, options: [Any, Yes, No], default: Any, visible_if: "doc.kind == 'Sum'"}
    - {name: place, type: data, max_length: 7, visible_if: "doc.kind == 'Sum'",
       description: "Only documents delivered to this country (its ISO code, e.g. IE), or anywhere else with ! before it (!IE); a document that names none counts as anywhere"}
    - {name: document, type: select, options: [Any, Invoice, Credit Note], default: Any, visible_if: "doc.kind == 'Sum'", description: "Credit notes count negative whatever is chosen"}
    - {name: formula, type: data, max_length: 400, visible_if: "doc.kind == 'Formula'", required_if: "doc.kind == 'Formula'",
       description: "Other boxes' codes with + - * / ( ), numbers, max(a, b) and min(a, b), e.g. max(T1 - T2, 0)"}
    - {name: description, type: text}

- name: TaxReturnDefinition
  label: Tax Return Definition
  kind: master
  module: accounting
  title_field: definition_name
  description: "A tax return's boxes: each a sum of the tax ledger's base or tax filtered by tax, rate, category, direction, place and document kind, a formula over other boxes, or entered by hand."
  fields:
    - {name: definition_name, type: data, required: true, unique: true, in_list: true}
    - {name: country, type: data, max_length: 2, in_list: true, in_filter: true, description: "The country whose return it is (ISO code); empty for any"}
    - {name: frequency, type: select, options: [Monthly, Bi-monthly, Quarterly, Half-yearly, Yearly], required: true, default: Monthly, in_list: true}
    - {name: boxes, type: table, of: TaxReturnBoxDefinition, required: true}
    - {name: notes, type: text}
  list: {columns: [definition_name, country, frequency], sort: definition_name asc}

- name: TaxReturnBox
  label: Return Box
  kind: child
  fields:
    - {name: code, type: data, read_only: true, in_list: true}
    - {name: label, type: data, read_only: true, in_list: true}
    - {name: computed, type: currency, read_only: true, in_list: true, label: From the Books}
    - {name: adjustment, type: currency, in_list: true, description: "Entered by hand, with its reason"}
    - {name: adjustment_reason, type: data, label: Reason}
    - {name: value, type: currency, read_only: true, in_list: true, label: Filed Value}

- name: TaxReturn
  label: Tax Return
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  numbering: {template: "TR-{FY}-{seq:4}", date_field: from_date}
  description: "A return for a period, its boxes worked out from the books while it is a draft and adjusted by hand with a reason. Submitting it files it: its values are kept, and no invoice of its period may be submitted or cancelled after."
  fields:
    - {name: definition, type: link, to: TaxReturnDefinition, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: from_date, type: date, required: true, in_list: true, label: Period From}
    - {name: to_date, type: date, read_only: true, in_list: true, label: Period To}
    - {name: boxes, type: table, of: TaxReturnBox}
    - {name: filed_on, type: date, read_only: true, no_copy: true}
    - {name: remarks, type: text}
  list: {columns: [number, definition, from_date, to_date], sort: from_date desc}

- name: NumberSeries
  label: Numbering Series
  label_plural: Numbering Series
  kind: master
  module: masters
  title_field: series_name
  description: "A way of numbering one kind of document, beside the usual one: a tax invoice against a simplified receipt, a branch's own run. A document takes the series it names, else the one its country's rules or the settings give, else the usual one."
  fields:
    - {name: series_name, type: data, required: true, in_list: true}
    - {name: document, type: select, required: true, in_list: true, in_filter: true, locked: true,
       options: [SalesOrder, DeliveryNote, SalesInvoice, PurchaseOrder, PurchaseReceipt, PurchaseInvoice, StockEntry, JournalEntry, PaymentEntry], label: For}
    - {name: company, type: link, to: Company, in_filter: true, description: "Empty: every company's"}
    - {name: template, type: data, required: true, in_list: true, label: Number Template,
       description: "As a document's usual number is made: SINV-{FY}-{seq:5}, {YYYY}, {YY}, {MM}, {DD}, {FY} and {field:<a field of the document>}; {seq:N} is the running number, N digits. Two series with the same text before and after {seq} share one running number"}
    - {name: gapless, type: check, label: Gapless, description: "The running number is taken inside the submission and given back when it fails or is cancelled before it commits, so no number is skipped; the series' documents take turns"}
    - {name: use_by_default, type: check, label: Use When a Document Names None, description: "Documents of this kind (of this company, when one is set) that name no series take this one. At most one per kind and company"}
    - {name: disabled, type: check}
  unique: [[company, document, series_name]]

- name: PaymentApprovalSettings
  label: Payment Approval Settings
  kind: settings
  module: setup
  description: "The value bands a payment's approval reads, in company currency: above each, its step must approve before a payment out is submitted"
  fields:
    - {name: enabled, type: check, default: false, label: Ask for Approval,
       description: "Off: payments are submitted as they always were. On: a payment to a supplier or a refund to a customer above a band waits for an Accounts Manager other than the person who made it"}
    - {name: first_above, type: currency, min: "0", default: 0, label: First Approval Above,
       description: "Payments out whose amount in company currency is above this need one Accounts Manager's approval"}
    - {name: second_above, type: currency, min: "0", label: Second Approval Above,
       description: "Above this, two Accounts Managers, neither the first one nor the maker; empty or 0: no second step"}
