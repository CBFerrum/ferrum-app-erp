- name: FiscalYear
  label: Fiscal Year
  kind: master
  module: setup
  title_field: year_name
  company_scoped: true
  fields:
    - {name: year_name, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, in_list: true, in_filter: true}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, required: true, in_list: true}
  unique: [[company, year_name]]
  exclusion:
    - {fields: [company], from: start_date, to: end_date, message: Fiscal years of a company cannot overlap}
  rules:
    - {name: ordered_dates, check: "doc.end_date > doc.start_date", message: "End date must be after start date"}
  actions:
    - {name: close_period, label: Close Accounting Period, permission: write, confirm: "Close the selected month? Postings into it will be refused."}
    - {name: reopen_period, label: Reopen Accounting Period, permission: write}
  list: {sort: start_date desc}

- name: FinanceBook
  label: Finance Book
  kind: master
  module: accounting
  title_field: finance_book_name
  description: "Another set of books beside the common one, such as IFRS beside local rules or a tax book: its own entries adjust it alone, and it has every entry with no book besides. Assets keep a book's own values in it."
  fields:
    - {name: finance_book_name, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
  list: {columns: [finance_book_name], sort: finance_book_name asc}

- name: CostCenter
  label: Cost Center
  kind: master
  module: setup
  title_field: cost_center_name
  company_scoped: true
  fields:
    - {name: cost_center_name, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, in_filter: true}
    - {name: parent_cost_center, type: link, to: CostCenter, link_filters: {is_group: true}}
    - {name: is_group, type: check}
    - {name: disabled, type: check}
  unique: [[company, cost_center_name]]

- name: Account
  label: Account
  kind: master
  module: masters
  title_field: account_name
  company_scoped: true
  search_fields: [account_number]
  fields:
    - {name: account_name, type: data, required: true, in_list: true}
    - {name: account_number, type: data, in_list: true}
    - {name: company, type: link, to: Company, required: true, locked: true, in_filter: true}
    - {name: parent_account, type: link, to: Account, link_filters: {is_group: true}, in_filter: true}
    - {name: is_group, type: check, in_list: true, in_filter: true}
    - {name: root_type, type: select, options: [Asset, Liability, Equity, Income, Expense], required: true, locked: true, in_list: true, in_filter: true}
    - name: account_type
      type: select
      in_filter: true
      options: [Receivable, Payable, Bank, Cash, Stock, Cost of Goods Sold, Stock Received But Not Billed, Tax, Income, Expense,
                Round Off, Exchange Gain Loss, Stock Adjustment, Fixed Asset, Equity, Temporary]
    - {name: account_currency, type: link, to: Currency, description: Leave empty for company currency}
    - {name: cash_flow_section, type: select, options: [Operating, Investing, Financing], label: Cash Flow Section, description: "Where a change in this account shows in the cash flow statement. Empty: fixed assets are investing, equity is financing, everything else operating"}
    - {name: frozen, type: check, description: Frozen accounts refuse new postings}
    - {name: eliminate_in_consolidation, type: check, label: Eliminate in Consolidation, description: "Business between the group's companies (intercompany sales and costs, loans): its balance cancels out when the group's books are added up"}
    - {name: disabled, type: check}
  unique: [[company, account_name], [company, account_number]]
  rules:
    - {name: party_accounts_are_leaves, check: "!(doc.is_group && (doc.account_type == 'Receivable' || doc.account_type == 'Payable'))", message: "Receivable/Payable accounts cannot be groups"}
  list: {columns: [account_number, account_name, root_type, is_group], sort: account_number asc}

- name: ItemTaxRate
  label: Item Tax Rate
  kind: child
  fields:
    - {name: tax_account, type: link, to: Account, required: true, link_filters: {account_type: Tax}, in_list: true}
    - {name: rate, type: percent, required: true, min: "0", in_list: true, description: "The item's rate for this tax; for an On Item Quantity tax, the amount per stock unit"}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], in_list: true, description: "The item's tax category for this tax; its tax row's when empty"}
    - {name: exemption_reason, type: data, description: "Why it is exempt or zero-rated: a code (VATEX-EU-132-1I) or the law's words"}

- name: TaxRow
  label: Tax Row
  kind: child
  fields:
    - {name: charge_type, type: select, options: [On Net Total, On Previous Row Amount, On Previous Row Total, Actual, On Item Quantity], required: true, default: On Net Total, in_list: true,
       description: "On Item Quantity: the rate is an amount per stock unit (excise, eco and packaging fees)"}
    - {name: account, type: link, to: Account, required: true, link_filters: {is_group: false}, in_list: true}
    - {name: description, type: data, in_list: true}
    - {name: rate, type: percent, min: "0", in_list: true, description: "A percentage (at most 1000); for On Item Quantity, the amount per stock unit"}
    - {name: amount, type: currency, description: Fixed amount for Actual charges}
    - {name: row_ref, type: int, min: 1, label: Reference Row, description: For "previous row" charges (1-based)}
    - {name: included_in_price, type: check, label: Included in Rate}
    - {name: deduct, type: check, description: Withholding taxes are deducted}
    - {name: reverse_charge, type: check, description: "The buyer accounts for this tax: worked out and reported, never charged to the party. A purchase posts it to this row's account and to the reverse-charge account; a sale posts nothing"}
    - {name: reverse_charge_account, type: link, to: Account, link_filters: {is_group: false}, visible_if: "doc.reverse_charge", description: "Purchases: the tax owed account the reverse charge is credited to"}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], description: "For tax reports and e-invoices. When empty: Reverse Charge for a reverse charge, Standard above a zero rate, Zero Rated at zero"}
    - {name: exemption_reason, type: data, description: "Why it is exempt or zero-rated: a code (VATEX-EU-132-1I) or the law's words"}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: tax_amount, type: currency, read_only: true, in_list: true}
    - {name: total, type: currency, read_only: true, in_list: true}
    - {name: base_tax_amount, type: currency, read_only: true}
    - {name: base_total, type: currency, read_only: true}

# What an invoice's taxes come to per tax, category and rate (EN 16931's VAT breakdown, BG-23).
- name: TaxBreakdown
  label: Tax Breakdown
  kind: child
  fields:
    - {name: description, type: data, read_only: true, in_list: true}
    - {name: account, type: link, to: Account, read_only: true}
    - {name: category, type: select, options: [Standard, Reduced, Zero Rated, Exempt, Reverse Charge, Intra-Community, Export, Out of Scope], read_only: true, in_list: true}
    - {name: rate, type: decimal, read_only: true, in_list: true, description: "A percentage, or an amount per stock unit for On Item Quantity taxes"}
    - {name: exemption_reason, type: data, read_only: true}
    - {name: reverse_charge, type: check, read_only: true}
    - {name: taxable_amount, type: currency, read_only: true, in_list: true}
    - {name: tax_amount, type: currency, read_only: true, in_list: true}
    - {name: base_taxable_amount, type: currency, read_only: true}
    - {name: base_tax_amount, type: currency, read_only: true}

- name: TaxTemplate
  label: Tax Template
  kind: master
  module: masters
  title_field: title
  company_scoped: true
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, in_filter: true}
    - {name: kind, type: select, options: [Sales, Purchase], required: true, in_list: true, in_filter: true}
    - {name: is_default, type: check, in_list: true}
    - {name: condition, type: code, description: "Optional CEL condition on the document, e.g. doc.place_of_supply == 'Karnataka'"}
    - {name: rows, type: table, of: TaxRow, required: true}
  unique: [[company, title]]

- name: TaxRate
  # A tax rate kept as data: from its first day it replaces the localization's built-in rate for
  # the category (a region's over the whole country's), so a new rate is a record, not a release.
  label: Tax Rate
  kind: master
  module: accounting
  title_field: category
  fields:
    - {name: country, type: data, required: true, max_length: 2, in_list: true, in_filter: true, description: "ISO 3166-1 alpha-2 code, e.g. SG"}
    - {name: region, type: data, max_length: 6, in_list: true, in_filter: true, description: "A state's or province's code (e.g. ON), or empty for the whole country"}
    - {name: category, type: data, required: true, max_length: 60, in_list: true, in_filter: true, description: "The localization's tax category, e.g. Standard or Reduced"}
    - {name: rate, type: percent, required: true, min: "0", in_list: true}
    - {name: valid_from, type: date, required: true, in_list: true}
    - {name: valid_to, type: date, in_list: true, description: "Empty: until a later rate for the category starts"}
    - {name: notes, type: text, description: "The law or notice it comes from"}
  unique: [[country, region, category, valid_from]]
  rules:
    - {name: country_code, check: "doc.country.matches('^[A-Z]{2}$')", message: "The country is its two capital letters (ISO 3166-1), e.g. SG"}
    - {name: at_most_100, check: "doc.rate <= 100.0", message: "A rate is at most 100%"}
    - {name: ends_after_start, check: "doc.valid_to == null || doc.valid_to >= doc.valid_from", message: "A rate cannot end before it starts"}
  list: {columns: [country, region, category, rate, valid_from, valid_to], sort: valid_from desc}
