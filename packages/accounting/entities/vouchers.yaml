- name: JournalEntryAccount
  label: Journal Entry Line
  kind: child
  fields:
    - {name: account, type: link, to: Account, required: true, link_filters: {company: {from: parent.company}, is_group: false}, in_list: true}
    - {name: party_type, type: select, options: [Customer, Supplier], in_list: true}
    - {name: customer, type: link, to: Customer, visible_if: "doc.party_type == 'Customer'", required_if: "doc.party_type == 'Customer'", in_list: true}
    - {name: supplier, type: link, to: Supplier, visible_if: "doc.party_type == 'Supplier'", required_if: "doc.party_type == 'Supplier'", in_list: true}
    - {name: debit, type: currency, min: "0", default: 0, in_list: true}
    - {name: credit, type: currency, min: "0", default: 0, in_list: true}
    - {name: reference_no, type: data, label: Invoice / Reference No, visible_if: "doc.party_type != null",
       description: "The number the customer or supplier knows it by (an invoice from the books before): what payments and statements show; the entry's number when empty"}
    - {name: due_date, type: date, visible_if: "doc.party_type != null", description: "When what the party owes falls due, for ageing and reminders; the entry's date when empty"}
    - {name: currency, type: link, to: Currency, visible_if: "doc.party_type != null", label: Party Currency,
       description: "Empty: the company's. Another currency carries what the party owes in it: give the rate and the amount in it, and the debit or credit is worked out"}
    - {name: exchange_rate, type: decimal, min: "0", visible_if: "doc.currency != null", description: "Party currency → company currency"}
    - {name: debit_in_currency, type: currency, currency: currency, min: "0", default: 0, visible_if: "doc.currency != null", label: Debit (Party Currency)}
    - {name: credit_in_currency, type: currency, currency: currency, min: "0", default: 0, visible_if: "doc.currency != null", label: Credit (Party Currency)}
    - {name: cost_center, type: link, to: CostCenter, link_filters: {company: {from: parent.company}, is_group: false}}
    - {name: project, type: link, to: Project}
    - {name: dimensions, type: json, description: "Its accounting dimensions by code, e.g. {\"department\": \"Sales\"}"}
    - {name: remarks, type: data}
  rules:
    - {name: one_side, check: "(doc.debit > 0.0) != (doc.credit > 0.0)", message: "Each line needs either a debit or a credit"}

- name: JournalEntry
  label: Journal Entry
  label_plural: Journal Entries
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  numbering: {template: "JV-{FY}-{seq:5}", gapless: true, on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_list: true, in_filter: true}
    - {name: number_series, type: link, to: NumberSeries, link_filters: {company: {from: company}}, no_copy: true, label: Numbering Series, in_filter: true,
       description: "The series this document is numbered from when it is submitted: one of those set up for it (a tax invoice, a branch). Empty: the series the company's settings or its country's rules give, else the usual one"}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: entry_type, type: select, options: [Journal Entry, Opening Entry, Adjustment, Depreciation, Exchange Revaluation], default: Journal Entry, in_filter: true}
    - {name: currency, type: link, to: Currency, fetch_from: company.default_currency, read_only: true}
    - {name: finance_book, type: link, to: FinanceBook, in_filter: true, description: "Empty, the entry is in every book; with a book, it adjusts that book alone"}
    - {name: accounts, type: table, of: JournalEntryAccount, required: true}
    - {name: total_debit, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: total_credit, type: currency, currency: currency, read_only: true}
    - {name: remark, type: text}
    - {name: auto_reverse, type: check, label: Reverse It, description: "An accrual or a prepayment: taken out again on its reversal day, when the invoice or payment it stood in for is booked"}
    - {name: reversal_date, type: date, visible_if: "doc.auto_reverse", no_copy: true, description: "The day after, when empty"}
    - {name: reversed_on, type: date, read_only: true, no_copy: true, visible_if: "doc.auto_reverse"}
    - {name: journal_template, type: link, to: JournalTemplate, link_filters: {company: {from: company}}, read_only: true, no_copy: true, in_filter: true, label: Made From}
    - {name: template_period, type: date, read_only: true, no_copy: true, label: For the Period Of}
  unique: [[journal_template, template_period]]
  rules:
    - {name: balanced, check: "doc.total_debit == doc.total_credit", message: "Total debit must equal total credit", on: submit}
    - {name: not_empty, check: "doc.total_debit > 0.0", message: "The entry has no amounts", on: submit}
  list: {columns: [number, posting_date, entry_type, total_debit], sort: posting_date desc}

- name: PaymentReference
  label: Payment Allocation
  kind: child
  fields:
    - {name: invoice_type, type: data, read_only: true, in_list: true, label: Document Type, description: "Set from the open item: an invoice, a journal entry line, a dunning..."}
    - {name: invoice, type: data, required: true, label: Open Item ID, description: "An open invoice, journal entry line or other open item of the party"}
    - {name: invoice_number, type: data, read_only: true, in_list: true}
    - {name: due_date, type: date, read_only: true, in_list: true}
    - {name: outstanding, type: currency, read_only: true, in_list: true}
    - {name: allocated_amount, type: currency, required: true, min: "0", in_list: true}
    - {name: discount_amount, type: currency, min: "0", in_list: true, label: Discount Taken,
       description: "An early-payment discount: settles the invoice by this much on top of what is allocated"}
    - {name: discount_account, type: link, to: Account, link_filters: {company: {from: parent.company}, is_group: false}, label: Discount Account,
       description: "Where the discount is booked: discount allowed on money received, discount received on money paid"}
    - {name: discount_reduces_tax, type: check, label: Discount Reduces the Tax,
       description: "Part of the discount takes back the invoice's tax, in the proportion the invoice charged it"}

- name: PaymentDeduction
  label: Payment Deduction
  kind: child
  fields:
    - {name: account, type: link, to: Account, required: true, link_filters: {company: {from: parent.company}, is_group: false}, in_list: true}
    - {name: cost_center, type: link, to: CostCenter, link_filters: {company: {from: parent.company}, is_group: false}, in_list: true}
    - {name: amount, type: currency, required: true, in_list: true, description: "In the payment currency. Positive amounts are debited (bank charges, discount allowed, tax the customer withheld); negative ones are credited (tax you withhold from a supplier)."}
    - {name: dimensions, type: json, description: "Its accounting dimensions by code, over the payment's"}
    - {name: remarks, type: data, in_list: true}

- name: PaymentEntry
  label: Payment Entry
  label_plural: Payment Entries
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  numbering: {template: "PAY-{FY}-{seq:5}", gapless: true, on: submit, date_field: posting_date}
  title_field: party_name
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: number_series, type: link, to: NumberSeries, link_filters: {company: {from: company}}, no_copy: true, label: Numbering Series, in_filter: true,
       description: "The series this document is numbered from when it is submitted: one of those set up for it (a tax invoice, a branch). Empty: the series the company's settings or its country's rules give, else the usual one"}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: payment_type, type: select, options: [Receive, Pay, Internal Transfer], required: true, default: Receive, in_list: true, in_filter: true,
       description: "Internal Transfer: money moved between two of the company's own bank and cash accounts, with no party"}
    - {name: is_refund, type: check, label: Refund, in_filter: true, visible_if: "doc.payment_type != 'Internal Transfer'",
       description: "Gives back the party's credit: a payment out to a customer or in from a supplier"}
    - {name: customer, type: link, to: Customer, in_filter: true,
       visible_if: "doc.payment_type != 'Internal Transfer' && (doc.payment_type == 'Receive') != doc.is_refund",
       required_if: "doc.payment_type != 'Internal Transfer' && (doc.payment_type == 'Receive') != doc.is_refund"}
    - {name: supplier, type: link, to: Supplier, in_filter: true,
       visible_if: "doc.payment_type != 'Internal Transfer' && (doc.payment_type == 'Receive') == doc.is_refund",
       required_if: "doc.payment_type != 'Internal Transfer' && (doc.payment_type == 'Receive') == doc.is_refund"}
    - {name: party_name, type: data, read_only: true, in_list: true}
    - {name: party_account, type: link, to: Account, link_filters: {company: {from: company}}, read_only: true}
    - {name: bank_account, type: link, to: Account, required: true, link_filters: {company: {from: company}, is_group: false}, label: Bank / Cash Account,
       description: "For a transfer, the account the money leaves"}
    - {name: paid_to, type: link, to: Account, link_filters: {company: {from: company}, is_group: false}, label: To Bank / Cash Account,
       visible_if: "doc.payment_type == 'Internal Transfer'", required_if: "doc.payment_type == 'Internal Transfer'", description: "The account the money goes to"}
    - {name: currency, type: link, to: Currency, required: true, in_list: true, description: "On a transfer, the currency of the account the money leaves"}
    - {name: exchange_rate, type: decimal, default: 1, min: "0.000000001", description: Payment currency → company currency}
    - {name: paid_amount, type: currency, currency: currency, required: true, min: "0", in_list: true}
    - {name: base_paid_amount, type: currency, read_only: true}
    - {name: received_currency, type: link, to: Currency, read_only: true, visible_if: "doc.payment_type == 'Internal Transfer'",
       description: "The currency of the account the money goes to"}
    - {name: received_amount, type: currency, currency: received_currency, min: "0", visible_if: "doc.payment_type == 'Internal Transfer'",
       description: "What reached the other account, in its currency: the amount paid when both are in one currency"}
    - {name: target_exchange_rate, type: decimal, min: "0", visible_if: "doc.payment_type == 'Internal Transfer'", label: Exchange Rate (To Account),
       description: "The receiving account's currency → company currency; worked out from the two amounts when empty"}
    - {name: base_received_amount, type: currency, read_only: true, visible_if: "doc.payment_type == 'Internal Transfer'"}
    - {name: unallocated_amount, type: currency, currency: currency, read_only: true}
    - {name: exchange_difference, type: currency, read_only: true}
    - {name: mode_of_payment, type: link, to: ModeOfPayment, in_filter: true, visible_if: "doc.payment_type != 'Internal Transfer'",
       description: "How it is paid. A mode paid by instrument (a cheque, a draft) records the instrument and reaches the bank account only when it clears"}
    - {name: reference_no, type: data, label: Cheque / Reference No, description: "For a mode paid by instrument, the instrument's number; a payment out takes the next from the mode's book when it gives none"}
    - {name: reference_date, type: date, description: "For a mode paid by instrument, the date written on it: it cannot clear before. A payment out is dated its posting date when empty"}
    - {name: instrument_bank, type: data, max_length: 140, label: Drawn On, visible_if: "doc.mode_of_payment != null", description: "The bank the instrument is drawn on"}
    - {name: payment_instrument, type: link, to: PaymentInstrument, link_filters: {company: {from: company}}, read_only: true, no_copy: true, label: Instrument}
    - {name: references, type: table, of: PaymentReference, label: Allocations}
    - {name: discount_taxes, type: json, read_only: true, no_copy: true, label: Tax Taken Back on Discounts,
       description: "Each early-payment discount's tax taken back, by invoice and tax, with the base it was on, in company currency: what the tax summary and tax returns count"}
    - {name: deductions, type: table, of: PaymentDeduction, label: Deductions and Charges, description: "Settles more (or less) than the bank moved: bank charges, early-payment discounts, tax withheld"}
    - {name: total_deductions, type: currency, currency: currency, read_only: true}
    - {name: withholding_category, type: link, to: WithholdingCategory, label: Withholding Category, visible_if: "doc.payment_type == 'Pay' && !doc.is_refund",
       description: "Over the bills' and the supplier's: what is withheld on this payment"}
    - {name: withholdings, type: table, of: WithholdingLine, read_only: true, label: Withholding, visible_if: "doc.payment_type == 'Pay' && !doc.is_refund"}
    - {name: withholding_amount, type: currency, currency: currency, read_only: true, label: Withheld, visible_if: "doc.payment_type == 'Pay' && !doc.is_refund",
       description: "Settles the supplier's bills on top of the money paid, booked to the categories' accounts"}
    - {name: stored_value_account, type: link, to: StoredValueAccount, link_filters: {company: {from: company}}, label: Stored Value Account, no_copy: true, visible_if: "doc.payment_type != 'Internal Transfer'",
       description: "Received: the invoices are paid from it. A refund: the credit goes back onto it. Its kind's liability account takes the bank account's place"}
    - {name: stored_value_code, type: data, label: Stored Value Code, no_copy: true, visible_if: "doc.payment_type != 'Internal Transfer'",
       description: "A card's code, typed or scanned, finds its account; kept only as its last four characters"}
    - {name: stored_value_pin, type: data, label: Stored Value PIN, no_copy: true, visible_if: "doc.payment_type != 'Internal Transfer'", description: "Never kept as typed"}
    - {name: stored_value_secret, type: data, read_only: true, hidden: true, no_copy: true}
    - {name: stored_value_kind, type: link, to: StoredValueKind, link_filters: {company: {from: company}}, label: Into New Store Credit, no_copy: true, visible_if: "doc.payment_type == 'Pay' && doc.is_refund",
       description: "A refund onto a new account of this kind, held by the customer, when no account is named"}
    - {name: stored_value_units, type: decimal, min: "0", label: Units, no_copy: true, visible_if: "doc.stored_value_account != null",
       description: "For a kind that holds units: how many are taken (or given back); they pay for its items' lines on the invoice"}
    - {name: dimensions, type: json, description: "Accounting dimensions by code for every line the payment books, e.g. {\"department\": \"Sales\"}"}
    - {name: remarks, type: text}
  rules:
    - {name: positive, check: "doc.paid_amount > 0.0", message: "Paid amount must be greater than zero", on: submit}
  actions:
    - {name: get_outstanding_invoices, label: Get Outstanding Invoices, docstatus: [0], permission: write}
  list: {columns: [number, posting_date, payment_type, party_name, paid_amount], sort: posting_date desc}

- name: OpeningInvoice
  label: Opening Invoice
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  title_field: party_name
  search_fields: [invoice_no]
  description: "An invoice still open in the books a company comes from, carried into these: what a customer still owes or the company still owes a supplier, under its own number and due date, in its own currency. A negative amount is an open credit: an advance, a credit note not yet used. One record per invoice, so a spreadsheet imports them; Post Opening Invoices on the company posts them all at once."
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: party_type, type: select, options: [Customer, Supplier], required: true, default: Customer, in_list: true, in_filter: true}
    - {name: customer, type: link, to: Customer, in_filter: true, visible_if: "doc.party_type == 'Customer'", required_if: "doc.party_type == 'Customer'"}
    - {name: supplier, type: link, to: Supplier, in_filter: true, visible_if: "doc.party_type == 'Supplier'", required_if: "doc.party_type == 'Supplier'"}
    - {name: party_name, type: data, read_only: true, in_list: true}
    - {name: invoice_no, type: data, required: true, label: Invoice No, in_list: true, in_filter: true,
       description: "The number the customer or supplier knows it by, from the books it comes from"}
    - {name: invoice_date, type: date, required: true, in_list: true}
    - {name: due_date, type: date, in_list: true, description: "When it falls due, for ageing and reminders; the invoice date when empty"}
    - {name: posting_date, type: date, required: true, default_expr: today, label: Opening Date, in_filter: true,
       description: "The day the balance is carried into these books: the books' first day, or the day before it"}
    - {name: currency, type: link, to: Currency, description: "Empty: the company's"}
    - {name: conversion_rate, type: decimal, min: "0", label: Exchange Rate, description: "Its currency → the company's, the rate it is carried at; needed for another currency"}
    - {name: amount, type: currency, currency: currency, required: true, label: Amount Still Open, in_list: true,
       description: "What is still owed on it, in its currency; negative for an open credit"}
    - {name: base_amount, type: currency, read_only: true, label: Amount (Company Currency)}
    - {name: outstanding_amount, type: currency, currency: currency, read_only: true, no_copy: true, in_list: true}
    - {name: party_account, type: link, to: Account, link_filters: {company: {from: company}}, read_only: true, label: Receivable / Payable Account}
    - {name: opening_account, type: link, to: Account, link_filters: {company: {from: company}}, read_only: true, label: Opening Balance Account, description: "The company's Opening Balance Account, which the balance is carried against"}
    - {name: status, type: select, options: [Draft, Unpaid, Partly Paid, Paid, Credit, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: remarks, type: text}
  rules:
    - {name: due_after_invoice, check: "doc.due_date == null || doc.due_date >= doc.invoice_date", message: "Due date cannot be before the invoice date"}
  list: {columns: [party_name, invoice_no, invoice_date, due_date, amount, outstanding_amount, status], sort: invoice_date desc}

# Payment instruments (FN-34): a cheque, a draft, a promissory note. A payment whose mode uses them
# records one; it waits in the instruments received (or issued) account until it clears into the bank
# account, and a bounce takes the payment back so its invoices are open again.
- name: ModeOfPaymentAccount
  label: Mode of Payment Account
  kind: child
  fields:
    - {name: company, type: link, to: Company, required: true, in_list: true}
    - {name: in_hand_account, type: link, to: Account, link_filters: {company: {from: company}, is_group: false}, in_list: true, label: Instruments Received Account,
       description: "An asset: what customers paid by instrument until it clears"}
    - {name: issued_account, type: link, to: Account, link_filters: {company: {from: company}, is_group: false}, in_list: true, label: Instruments Issued Account,
       description: "A liability: what the company paid by instrument until it clears"}
    - {name: bounce_charge_account, type: link, to: Account, link_filters: {company: {from: company}, is_group: false}, label: Bounce Charge Account,
       description: "Income a customer's charge for a bounced instrument is credited to"}
    - {name: next_instrument_no, type: int, min: "0", label: Next Number Issued,
       description: "A book of instruments (a cheque book): a payment out by this mode that gives no number takes this one, and the next is one more. Empty: each payment gives its own"}
    - {name: last_instrument_no, type: int, min: "0", label: Last Number in the Book, description: "The book's last number; empty: no end"}
    - {name: instrument_prefix, type: data, max_length: 20, label: Number Prefix, description: "Put before each number drawn from the book"}
    - {name: instrument_digits, type: int, min: "0", max: "20", label: Digits, description: "Numbers drawn are padded with zeros to this many digits"}

- name: ModeOfPayment
  label: Mode of Payment
  label_plural: Modes of Payment
  kind: master
  module: accounting
  title_field: mode_name
  fields:
    - {name: mode_name, type: data, required: true, unique: true, in_list: true}
    - {name: uses_instruments, type: check, in_list: true, label: Paid by Instrument,
       description: "A cheque, a draft, a promissory note: a payment records the instrument (its number, the date written on it, its bank) and books to the instruments received or issued account until it clears"}
    - {name: bounce_charge, type: currency, min: "0", visible_if: "doc.uses_instruments", label: Charge for a Bounce,
       description: "What a customer is charged when an instrument they gave bounces (empty: nothing); whoever records the bounce may leave it off"}
    - {name: accounts, type: table, of: ModeOfPaymentAccount, label: Accounts by Company}
    - {name: disabled, type: check, in_filter: true}
  list: {columns: [mode_name, uses_instruments, disabled], sort: mode_name asc}

- name: PaymentInstrument
  label: Payment Instrument
  kind: master
  module: accounting
  company_scoped: true
  title_field: instrument_no
  description: "A cheque, a draft or another instrument a payment was made with: received or issued, deposited, cleared, bounced, cancelled or replaced. Made by the payment; its state moves by its actions."
  fields:
    - {name: company, type: link, to: Company, in_list: true, read_only: true, in_filter: true}
    - {name: direction, type: select, options: [Received, Issued], read_only: true, in_list: true, in_filter: true}
    - {name: instrument_no, type: data, read_only: true, in_list: true, label: Number}
    - {name: instrument_date, type: date, read_only: true, in_list: true, in_filter: true, label: Dated, description: "The date written on it: it does not clear before"}
    - {name: bank, type: data, read_only: true, label: Drawn On}
    - {name: mode_of_payment, type: link, to: ModeOfPayment, read_only: true}
    - {name: payment_entry, type: link, to: PaymentEntry, read_only: true, in_filter: true}
    - {name: party_name, type: data, read_only: true, in_list: true}
    - {name: customer, type: link, to: Customer, read_only: true, in_filter: true, description: "Who gave it, from its payment"}
    - {name: supplier, type: link, to: Supplier, read_only: true, in_filter: true, description: "Who it was paid to, from its payment"}
    - {name: currency, type: link, to: Currency, read_only: true}
    - {name: amount, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: holding_account, type: link, to: Account, link_filters: {company: {from: company}}, read_only: true, label: Waits In, description: "The instruments account it is booked to until it clears"}
    - {name: status, type: select, options: [Received, Issued, Deposited, Cleared, Bounced, Cancelled, Replaced], read_only: true, in_list: true, in_filter: true}
    - {name: deposited_on, type: date, read_only: true}
    - {name: cleared_on, type: date, read_only: true}
    - {name: bounced_on, type: date, read_only: true}
    - {name: reason, type: text, read_only: true, description: "Why it bounced, was cancelled or replaced"}
    - {name: charge_entry, type: link, to: JournalEntry, read_only: true, label: Charge, description: "The customer's charge for the bounce"}
    - {name: replaces, type: link, to: PaymentInstrument, link_filters: {company: {from: company}}, read_only: true}
    - {name: replaced_by, type: link, to: PaymentInstrument, link_filters: {company: {from: company}}, read_only: true}
    - {name: reminded_on, type: date, read_only: true, description: "When those who deposit were told it can be deposited"}
  actions:
    - {name: deposit, label: Deposit, permission: write, condition: "doc.status == 'Received'",
       params: [{name: on, label: Deposited On, type: date, description: "Today when empty"}]}
    - {name: clear, label: Cleared, permission: write, condition: "doc.status == 'Received' || doc.status == 'Deposited' || doc.status == 'Issued'",
       params: [{name: on, label: Cleared On, type: date, description: "Today when empty; not before the date written on it"}]}
    - {name: bounce, label: Bounced, permission: write, condition: "doc.status != 'Bounced' && doc.status != 'Cancelled' && doc.status != 'Replaced'",
       confirm: "The payment is taken back and what it paid is owed again.",
       params: [{name: on, label: Bounced On, type: date, description: "Today when empty"}, {name: reason, label: Reason, type: text, required: true},
                {name: no_charge, label: Do Not Charge the Customer, type: check, description: "Leave off the mode's charge for a bounce"}]}
    - {name: cancel_instrument, label: Cancel Instrument, permission: write, condition: "doc.status == 'Received' || doc.status == 'Deposited' || doc.status == 'Issued'",
       confirm: "The payment is taken back and what it paid is owed again.",
       params: [{name: on, label: Cancelled On, type: date}, {name: reason, label: Reason, type: text, required: true}]}
    - {name: replace, label: Replace, permission: write, condition: "doc.status == 'Received' || doc.status == 'Deposited' || doc.status == 'Issued'",
       params: [{name: instrument_no, label: New Number, type: data, required: true}, {name: instrument_date, label: Dated, type: date, required: true},
                {name: bank, label: Drawn On, type: data}, {name: reason, label: Reason, type: text}]}
  list: {columns: [instrument_no, instrument_date, direction, party_name, amount, status], sort: instrument_date asc}

# Bad-debt write-off (FN-13): a customer's invoice that will not be paid, written off in one action to
# the account its reason names, with the tax relief a country gives through the localization seam,
# and what is recovered later booked against it.
- name: WriteOffReasonAccount
  label: Write-off Account
  kind: child
  fields:
    - {name: company, type: link, to: Company, required: true, in_list: true}
    - {name: account, type: link, to: Account, required: true, link_filters: {company: {from: company}, is_group: false}, in_list: true, label: Written Off To, description: "An expense: bad debts"}
    - {name: recovery_account, type: link, to: Account, link_filters: {company: {from: company}, is_group: false}, in_list: true, label: Recovered To,
       description: "Income: bad debts recovered; the write-off account when empty"}

- name: WriteOffReason
  label: Write-off Reason
  kind: master
  module: accounting
  title_field: reason_name
  fields:
    - {name: reason_name, type: data, required: true, unique: true, in_list: true}
    - {name: accounts, type: table, of: WriteOffReasonAccount, label: Accounts by Company}
    - {name: description, type: text}
  list: {columns: [reason_name], sort: reason_name asc}

- name: BadDebtRelief
  label: Tax Relief
  kind: child
  fields:
    - {name: account, type: link, to: Account, link_filters: {company: {from: parent.company}}, read_only: true, in_list: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: description, type: data, read_only: true, in_list: true}

- name: BadDebtWriteOff
  label: Bad Debt Write-off
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  title_field: customer_name
  numbering: {template: "BDW-{FY}-{seq:4}", gapless: true, on: submit, date_field: posting_date}
  description: "A customer's invoice written off as a bad debt: to the account its reason names, less the tax relief the company's country gives; submitting it is the approval (the workspace's approval policy, when it sets one). A later recovery is booked against it."
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true}
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, read_only: true, in_list: true}
    - {name: invoice, type: data, required: true, label: Open Item ID, description: "The customer's open invoice (or other open item) written off"}
    - {name: invoice_type, type: data, read_only: true, label: Document Type}
    - {name: invoice_number, type: data, read_only: true, in_list: true}
    - {name: currency, type: data, read_only: true}
    - {name: outstanding, type: currency, read_only: true}
    - {name: amount, type: currency, min: "0", in_list: true, description: "In the invoice's currency; all that is outstanding when empty"}
    - {name: base_amount, type: currency, read_only: true, label: Amount (Company Currency)}
    - {name: reason, type: link, to: WriteOffReason, required: true, in_filter: true}
    - {name: write_off_account, type: link, to: Account, link_filters: {company: {from: company}}, read_only: true}
    - {name: relief, type: table, of: BadDebtRelief, read_only: true, label: Tax Relief}
    - {name: recovered_amount, type: currency, read_only: true, no_copy: true, label: Recovered (Company Currency)}
    - {name: remarks, type: text}
  actions:
    - {name: record_recovery, label: Record Recovery, docstatus: [1], permission: submit,
       params: [{name: amount, label: Amount Recovered (Company Currency), type: currency, required: true}, {name: on, label: Received On, type: date},
                {name: bank_account, label: Into, type: link, to: Account, required: true}]}
  list: {columns: [number, posting_date, customer_name, invoice_number, amount, recovered_amount], sort: posting_date desc}

# Recurring journals (FN-06, FN-07): a template's lines made into a journal entry every period.
- name: JournalTemplate
  label: Journal Template
  kind: master
  module: accounting
  company_scoped: true
  title_field: template_name
  description: "A journal entry's lines kept to be made again: by hand from a copy, or every period by the upkeep from its start until its end date or its count, as a draft or submitted. Its next date says what is due; the journal entries made from it list what was made."
  fields:
    - {name: template_name, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, in_list: true, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: accounts, type: table, of: JournalEntryAccount, required: true, label: Lines}
    - {name: remark, type: text, description: "The made entries' remark; the template's name when empty"}
    - {name: repeat, type: check, in_list: true, label: Make It Every Period}
    - {name: frequency, type: select, options: [Monthly, Quarterly, Half-yearly, Yearly], default: Monthly, visible_if: "doc.repeat"}
    - {name: start_date, type: date, visible_if: "doc.repeat", required_if: "doc.repeat", description: "The first entry's day; later ones fall on the same day of their month (or its last day)"}
    - {name: end_date, type: date, visible_if: "doc.repeat", description: "None after it; empty: no end"}
    - {name: occurrences, type: int, min: 0, visible_if: "doc.repeat", label: How Many, description: "Stops after this many; empty: no limit"}
    - {name: submit, type: check, visible_if: "doc.repeat", label: Submit Them, description: "Made submitted; left as drafts to check when not ticked"}
    - {name: auto_reverse, type: check, label: Reverse Each, description: "An accrual: each entry made is taken out again the day after"}
    - {name: next_date, type: date, read_only: true, no_copy: true, in_list: true, in_filter: true, label: Next Due}
    - {name: last_made, type: date, read_only: true, no_copy: true}
    - {name: made_count, type: int, read_only: true, no_copy: true, label: Made So Far}
    - {name: disabled, type: check, in_filter: true}
  unique: [[company, template_name]]
  list: {columns: [template_name, frequency, next_date, made_count], sort: next_date asc}
