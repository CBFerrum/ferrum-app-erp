- name: ItemPlanning
  label: Item Planning
  kind: child
  fields:
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, in_list: true, description: "Empty: every warehouse without a row of its own"}
    - {name: safety_stock, type: decimal, min: "0", in_list: true}
    - {name: min_order_qty, type: decimal, min: "0", in_list: true, label: Minimum Order}
    - {name: order_multiple, type: decimal, min: "0", in_list: true, label: Order Multiple}
    - {name: max_order_qty, type: decimal, min: "0", in_list: true, label: Maximum Order, description: "Larger needs are split into several orders. Empty: no most"}
    - {name: lead_time_days, type: int, min: "0", label: Lead Time (Days), description: "Empty: the item's"}

- name: BomItem
  label: BOM Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true, description: Quantity per BOM quantity}
    - {name: uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Unit}
    - {name: scrap_percent, type: percent, default: 0, min: "0", max: "99"}
    - {name: rate, type: currency, read_only: true, description: Valuation rate used for costing}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: source_warehouse, type: link, to: Warehouse, link_filters: {company: {from: parent.company}, is_group: false}}
    - {name: reference_designators, type: text, description: "e.g. R1-R12, C3"}

- name: BomOutput
  label: Other Output
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true, description: Quantity per BOM quantity}
    - {name: kind, type: select, options: [By-product, Co-product], required: true, default: By-product, in_list: true,
       description: "By-product: valued first, at its value per unit or its share of cost (scrap with a recovery value is one). Co-product: shares what is left with the main item by the BOM's basis"}
    - {name: rate, type: currency, min: "0", in_list: true, label: Value or Weight per Unit,
       description: "By-product: its value per unit (empty: its share of cost below). Co-product: its ratio or standard value per unit, as the BOM's basis says"}
    - {name: cost_share, type: percent, min: "0", max: "100", label: Share of Cost (%), visible_if: "doc.kind == 'By-product'"}

- name: Bom
  label: Bill of Materials
  label_plural: Bills of Materials
  kind: document
  module: manufacturing
  submittable: true
  company_scoped: true
  title_field: item_name
  numbering: {template: "BOM-{field:revision}-{seq:4}", on: submit}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: item, type: link, to: Item, required: true, in_list: true, in_filter: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: revision, type: data, required: true, default: A, max_length: 10, in_list: true}
    - {name: quantity, type: decimal, required: true, default: 1, min: "0.000000001", description: Quantity this BOM produces}
    - {name: is_active, type: check, default: true, in_list: true}
    - {name: is_default, type: check, default: true, in_list: true}
    - {name: effective_from, type: date}
    - {name: items, type: table, of: BomItem, required: true}
    - {name: operating_cost, type: currency, default: 0, min: "0", description: Labour and overheads per BOM quantity}
    - {name: outputs, type: table, of: BomOutput, label: By-products and Co-products}
    - {name: co_product_basis, type: select, options: [Quantity, Ratio, Standard Value], default: Quantity, label: Co-products Share Cost By,
       description: "Quantity: by how many. Ratio or Standard Value: by quantity times each one's ratio or standard value per unit (the main item's below)"}
    - {name: main_weight, type: decimal, min: "0", label: Main Item's Ratio or Standard Value, visible_if: "doc.co_product_basis != 'Quantity'"}
    - {name: raw_material_cost, type: currency, read_only: true, no_copy: true}
    - {name: total_cost, type: currency, read_only: true, no_copy: true, in_list: true}
    - {name: change_note, type: text, description: Engineering change description for this revision}
  actions:
    - {name: update_cost, label: Update Cost, docstatus: [0, 1], permission: write,
       contract: {effect: transactional_action, returns: {type: object, properties: {raw_material_cost: {type: [string, "null"]}, total_cost: {type: [string, "null"]}}}, completion: "The BOM's lines and totals are costed again at today's rates, committed with this receipt"}}
  list: {columns: [number, item_name, revision, is_default, total_cost], sort: created_at desc}

- name: WorkOrder
  label: Work Order
  kind: document
  module: manufacturing
  submittable: true
  company_scoped: true
  title_field: item_name
  numbering: {template: "WO-{FY}-{seq:5}", on: submit, date_field: planned_start_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: item, type: link, to: Item, required: true, in_filter: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: bom, type: link, to: Bom, required: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: produced_qty, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: source_warehouse, type: link, to: Warehouse, required: true, link_filters: {company: {from: company}, is_group: false}, label: Raw Material Warehouse}
    - {name: target_warehouse, type: link, to: Warehouse, required: true, link_filters: {company: {from: company}, is_group: false}, label: Finished Goods Warehouse}
    - {name: planned_start_date, type: date, required: true, default_expr: today}
    - {name: expected_end_date, type: date}
    - {name: sales_order, type: link, to: SalesOrder}
    - {name: material_request, type: data, read_only: true, no_copy: true, in_filter: true, label: Material Request,
       description: "The manufacture request it fulfils (Material Requests come with the Procurement app)"}
    - {name: material_request_item, type: data, read_only: true, no_copy: true, hidden: true}
    - {name: status, type: select, options: [Draft, Not Started, In Process, Completed, Stopped, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: actual_cost, type: currency, read_only: true, no_copy: true}
  actions:
    - {name: manufacture, label: Produce, docstatus: [1], permission: submit, condition: "doc.produced_qty < doc.qty && doc.status != 'Stopped'",
       params: [{name: qty, label: Quantity, description: "How many to produce; what remains of the order when empty"}, {name: posting_date, type: date, label: Posting Date}, {name: submit, type: check, label: Submit the Entry, description: "On unless set to no: a draft is left to add batch or serial numbers to"}],
       contract: {effect: transactional_action, returns: {type: object, properties: {entity: {type: string, const: StockEntry}, id: {type: string, format: uuid, x-ferrum-link: StockEntry}, number: {type: [string, "null"]}}}, completion: "A Manufacture Stock Entry for the quantity (the rest of the order when none is given) exists, consuming the BOM's materials and receiving the finished goods and by-products, submitted unless asked to leave it as a draft; the work order's produced quantity follows the entry"}}
    - {name: stop, label: Stop, docstatus: [1], permission: submit,
       contract: {effect: transactional_action, returns: {type: object, properties: {status: {type: string}}}, completion: "The work order is Stopped: nothing more is produced on it until it is resumed, committed with this receipt", compensate_with: resume}}
    - {name: resume, label: Resume, docstatus: [1], permission: submit, condition: "doc.status == 'Stopped'",
       contract: {effect: transactional_action, returns: {type: object, properties: {status: {type: string}}}, completion: "The work order is In Process, or Not Started when nothing was produced, and can be produced on again, committed with this receipt", compensate_with: stop}}
  list: {columns: [number, item_name, qty, produced_qty, status], sort: planned_start_date desc}

- name: MrpLine
  label: MRP Line
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true}
    - {name: item_name, type: data, read_only: true, in_list: true}
    - {name: action, type: select, options: [Purchase, Manufacture, Transfer], in_list: true}
    - {name: source_warehouse, type: link, to: Warehouse, link_filters: {company: {from: parent.company}}, label: From Warehouse, description: "A transfer's: the warehouse with more than it needs"}
    - {name: bucket_start, type: date, read_only: true, in_list: true, label: Needed In, description: "The first day of the period it is needed in"}
    - {name: gross_requirement, type: decimal, read_only: true}
    - {name: available, type: decimal, read_only: true}
    - {name: on_order, type: decimal, read_only: true}
    - {name: safety_stock, type: decimal, read_only: true}
    - {name: net_requirement, type: decimal, read_only: true, in_list: true}
    - {name: suggested_qty, type: decimal, in_list: true}
    - {name: supplier, type: link, to: Supplier}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {company: {from: parent.company}}}
    - {name: required_by, type: date}
    - {name: created_document, type: data, read_only: true}

- name: MrpWarehouse
  label: Planning Warehouse
  kind: child
  fields:
    - {name: warehouse, type: link, to: Warehouse, required: true, link_filters: {company: {from: parent.company}, is_group: false}, in_list: true}

- name: MrpMessage
  label: Action Message
  kind: child
  fields:
    - {name: message, type: select, options: [Bring Forward, Push Out, Cancel, Increase, Decrease], in_list: true}
    - {name: document_type, type: data, read_only: true, in_list: true}
    - {name: document, type: data, read_only: true, in_list: true, description: "The order's number and line"}
    - {name: item, type: link, to: Item, read_only: true, in_list: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {company: {from: parent.company}}, read_only: true}
    - {name: current_date, type: date, read_only: true}
    - {name: current_qty, type: decimal, read_only: true}
    - {name: suggested_date, type: date, read_only: true, in_list: true}
    - {name: suggested_qty, type: decimal, read_only: true, in_list: true}

- name: DemandForecastLine
  label: Forecast Line
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: period_start, type: date, required: true, in_list: true, label: Month}
    - {name: history_avg, type: decimal, read_only: true, in_list: true, label: Monthly Average Sold}
    - {name: forecast_qty, type: decimal, read_only: true, in_list: true, label: Forecast}
    - {name: planned_qty, type: decimal, min: "0", in_list: true, label: Plan For, description: "What planning uses: the forecast unless you change it"}

- name: DemandForecast
  label: Demand Forecast
  kind: document
  module: manufacturing
  company_scoped: true
  numbering: {template: "FC-{YYYY}{MM}-{seq:4}"}
  description: "Expected monthly demand per item in a warehouse, worked out from what was sold, for requirements runs to plan for."
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: warehouse, type: link, to: Warehouse, required: true, link_filters: {company: {from: company}, is_group: false}, in_list: true}
    - {name: method, type: select, options: [Moving Average, Exponential Smoothing, Seasonal], required: true, default: Moving Average, in_list: true,
       description: "Moving Average: the mean of the last three months. Exponential Smoothing: recent months weigh more. Seasonal: each month by its share in earlier years; needs 24 months of history"}
    - {name: history_months, type: int, min: "3", max: "60", default: 12, label: History (Months)}
    - {name: smoothing, type: decimal, min: "0.05", max: "0.95", default: 0.3, visible_if: "doc.method == 'Exponential Smoothing'", description: "How much the latest month counts"}
    - {name: periods, type: int, min: "1", max: "24", default: 3, label: Months Ahead}
    - {name: item_group, type: link, to: ItemGroup, description: "Only items of this group and its subgroups; empty: every stock item sold from the warehouse"}
    - {name: lines, type: table, of: DemandForecastLine}
    - {name: status, type: select, options: [Draft, Computed], default: Draft, read_only: true, in_list: true}
  rules:
    - {name: seasons_need_two_years, check: "doc.method != 'Seasonal' || doc.history_months >= 24", message: "A seasonal forecast needs at least 24 months of history"}
  actions:
    - name: compute
      label: Work Out the Forecast
      permission: write
      params: []
      contract:
        effect: transactional_action
        returns: {type: object, properties: {items: {type: integer}, lines: {type: integer}, from: {type: string}, to: {type: string}}}
        completion: "The forecast's lines hold each item's expected demand for each month ahead, from the stock ledger as it is now; figures a person changed are kept, committed with this receipt"
  list: {columns: [number, warehouse, method, status], sort: created_at desc}

- name: MrpRun
  label: MRP Run
  kind: document
  module: manufacturing
  company_scoped: true
  numbering: {template: "MRP-{YYYY}{MM}-{seq:4}"}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: warehouse, type: link, to: Warehouse, required: true, link_filters: {company: {from: company}, is_group: false}, description: Planning warehouse}
    - {name: include_sales_orders, type: check, default: true}
    - {name: forecast, type: link, to: DemandForecast, link_filters: {company: {from: company}, status: Computed}, label: Demand Forecast,
       description: "Plan for it too: each month's forecast, less what open sales orders of that month already ask for"}
    - {name: demand_until, type: date, description: Sales orders with delivery dates up to this date}
    - {name: bucket, type: select, options: [Day, Week, Month], label: Plan By,
       description: "Empty: one total for the planning warehouse, as before. A period: demand and orders by period over the horizon, the warehouses below, transfers between them and action messages on the orders already there"}
    - {name: horizon_days, type: int, min: "1", default: 90, label: Horizon (Days), visible_if: "doc.bucket != null"}
    - {name: warehouses, type: table, of: MrpWarehouse, label: Plan Across, visible_if: "doc.bucket != null", description: "Empty: the planning warehouse"}
    - {name: lines, type: table, of: MrpLine}
    - {name: messages, type: table, of: MrpMessage, label: Action Messages}
    - {name: status, type: select, options: [Draft, Planned, Orders Created], default: Draft, read_only: true, in_list: true}
  actions:
    - {name: run, label: Run MRP, docstatus: [0], permission: write,
       contract: {effect: transactional_action, returns: {type: object, properties: {lines: {type: integer}}}, completion: "The MRP run's lines hold what each item needs ordered, bought or made, and the run is Planned, committed with this receipt"}}
    - {name: create_orders, label: Create Purchase Orders & Work Orders, docstatus: [0], permission: write, condition: "doc.status == 'Planned'",
       contract: {effect: transactional_action, returns: {type: object, properties: {created: {type: array, items: {type: object, properties: {entity: {type: string}, id: {type: string, format: uuid}, number: {type: [string, "null"]}}}}}}, completion: "A Purchase Order for each supplier, a Work Order for each item to make and one Stock Entry for the transfers exist as drafts, each MRP line names the document made for it, and the run is Orders Created, committed with this receipt"}}
