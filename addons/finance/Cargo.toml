[package]
name = "ferrum-finance"
description = "Budgets, bank reconciliation, period closing, dunning, subscriptions and payment terms"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
ferrum-kernel = { workspace = true }
ferrum-meta = { workspace = true }
ferrum-domain = { workspace = true }
