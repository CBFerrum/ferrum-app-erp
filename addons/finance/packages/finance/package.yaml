package: finance
version: 0.1.0
label: Finance
description: Budgets with commitment control, bank accounts, statement import and reconciliation, payment allocation, exchange revaluation, period closing, payment terms and schedules, dunning, subscriptions and advance allocation.
depends: [accounting, selling, buying]
field_prefix: fin_

modules:
  - name: finance
    label: Finance
    icon: landmark
    order: 25
    # report:bank_reconciliation is not a report of the server's: the ERP interface answers that address
    # with the reconciliation workbench, so it shows in the sidebar beside the bank's records.
    items: [report:finance_overview, Budget, MonthlyDistribution, BankAccount, BankTransaction, StatementFormat, BankRule, PaymentRun, report:bank_reconciliation, PaymentAllocation, ExchangeRevaluation, PeriodClosingVoucher, PaymentTermsTemplate,
            DunningType, Dunning, SubscriptionPlan, Subscription, report:budget_variance, report:bank_reconciliation_statement, report:cash_flow_forecast,
            report:receivables_by_due_date, report:dunning_summary, report:subscription_metrics]

roles:
  - name: Accounts Manager
    permissions:
      - {entity: Budget, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: MonthlyDistribution, read: true, write: true, create: true, delete: true}
      - {entity: BankAccount, read: true, write: true, create: true, delete: true, export: true, read_groups: [bank_details], write_groups: [bank_details]}
      - {entity: BankTransaction, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, import: true}
      - {entity: StatementFormat, read: true, write: true, create: true, delete: true, export: true}
      - {entity: BankRule, read: true, write: true, create: true, delete: true, export: true}
      - {entity: PaymentRun, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PaymentAllocation, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: ExchangeRevaluation, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: PeriodClosingVoucher, read: true, write: true, create: true, delete: true, submit: true, cancel: true}
      - {entity: PaymentTermsTemplate, read: true, write: true, create: true, delete: true}
      - {entity: DunningType, read: true, write: true, create: true, delete: true}
      - {entity: Dunning, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: SubscriptionPlan, read: true, write: true, create: true, delete: true}
      - {entity: Subscription, read: true, write: true, create: true, delete: true, export: true}
  - name: Accounts User
    permissions:
      - {entity: Budget, read: true}
      - {entity: MonthlyDistribution, read: true}
      - {entity: BankAccount, read: true}
      - {entity: BankTransaction, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: StatementFormat, read: true}
      - {entity: BankRule, read: true}
      - {entity: PaymentRun, read: true, write: true, create: true, delete: true}
      - {entity: PaymentAllocation, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: ExchangeRevaluation, read: true}
      - {entity: PeriodClosingVoucher, read: true}
      - {entity: PaymentTermsTemplate, read: true}
      - {entity: DunningType, read: true}
      - {entity: Dunning, read: true, write: true, create: true, delete: true}
      - {entity: SubscriptionPlan, read: true}
      - {entity: Subscription, read: true, write: true, create: true}

overlays:
  - entity: SalesInvoice
    ops:
      - {op: add_field, after: due_date, field: {name: fin_payment_terms_template, type: link, to: PaymentTermsTemplate, label: Payment Terms Template}}
      - {op: add_field, after: fin_payment_terms_template, field: {name: fin_payment_schedule, type: table, of: PaymentSchedule, label: Payment Schedule}}
      - {op: add_field, field: {name: fin_subscription, type: link, to: Subscription, read_only: true, label: Subscription}}
      - {op: add_field, field: {name: fin_subscription_period_start, type: date, read_only: true, label: Subscription Period From}}
      - {op: add_field, field: {name: fin_subscription_period_end, type: date, read_only: true, label: Subscription Period To}}
      - op: add_action
        action: {name: allocate_advances, label: Allocate Advance Payments, docstatus: [1], permission: submit, condition: "doc.outstanding_amount > 0.0"}
  - entity: PurchaseInvoice
    ops:
      - {op: add_field, after: due_date, field: {name: fin_payment_terms_template, type: link, to: PaymentTermsTemplate, label: Payment Terms Template}}
      - {op: add_field, after: fin_payment_terms_template, field: {name: fin_payment_schedule, type: table, of: PaymentSchedule, label: Payment Schedule}}
      - {op: add_field, column: true, after: fin_payment_schedule, field: {name: fin_payment_hold, type: check, read_only: true, no_copy: true, in_filter: true, label: Payment on Hold,
          description: "Disputed, or a match exception: payment runs leave it out until it is released"}}
      - {op: add_field, after: fin_payment_hold, field: {name: fin_hold_reason, type: text, read_only: true, no_copy: true, label: Why on Hold}}
      - op: add_action
        action: {name: allocate_advances, label: Allocate Advance Payments, docstatus: [1], permission: submit, condition: "doc.outstanding_amount > 0.0"}
      - op: add_action
        action: {name: fin_hold_payment, label: Hold Payment, docstatus: [1], permission: submit, condition: "!doc.fin_payment_hold",
                 params: [{name: reason, label: Why, type: text, required: true}]}
      - op: add_action
        action: {name: fin_release_payment, label: Release Payment, docstatus: [1], permission: submit, condition: "doc.fin_payment_hold"}
  - entity: Supplier
    ops:
      - {op: add_field, column: true, field: {name: fin_iban, type: data, max_length: 42, label: IBAN / Account No, description: "Where payment runs pay them"}}
      - {op: add_field, column: true, after: fin_iban, field: {name: fin_bic, type: data, max_length: 20, label: BIC / Bank Code}}
  - entity: SalesOrder
    ops:
      - {op: add_field, field: {name: fin_payment_terms_template, type: link, to: PaymentTermsTemplate, label: Payment Terms Template}}
      - {op: add_field, field: {name: fin_payment_schedule, type: table, of: PaymentSchedule, label: Payment Schedule}}
  - entity: PurchaseOrder
    ops:
      - {op: add_field, field: {name: fin_cost_center, type: link, to: CostCenter, link_filters: {company: {from: company}, is_group: false}, label: Cost Center, description: Default cost center of the lines (budget commitments)}}
      - {op: add_field, field: {name: fin_payment_terms_template, type: link, to: PaymentTermsTemplate, label: Payment Terms Template}}
      - {op: add_field, field: {name: fin_payment_schedule, type: table, of: PaymentSchedule, label: Payment Schedule}}
  - entity: PurchaseOrderItem
    ops:
      - {op: add_field, field: {name: fin_expense_account, type: link, to: Account, link_filters: {company: {from: parent.company}, is_group: false}, label: Expense Account, description: Budget account this line commits (non-stock items default to the item's or company's expense account)}}
      - {op: add_field, field: {name: fin_cost_center, type: link, to: CostCenter, link_filters: {company: {from: parent.company}, is_group: false}, label: Cost Center}}
  - entity: PaymentEntry
    ops:
      - {op: add_field, field: {name: fin_clearance_date, type: date, read_only: true, no_copy: true, label: Clearance Date, description: Set when bank reconciliation clears the whole amount}}
  - entity: JournalEntry
    ops:
      - {op: add_field, field: {name: fin_clearance_date, type: date, read_only: true, no_copy: true, label: Clearance Date, description: Set when bank reconciliation clears the whole bank amount}}
  - entity: Customer
    ops:
      - {op: add_field, field: {name: fin_payment_terms_template, type: link, to: PaymentTermsTemplate, label: Payment Terms Template}}
      - {op: add_field, field: {name: fin_dunning_type, type: link, to: DunningType, label: Dunning Type, description: Overrides the company's default dunning type}}
  - entity: Supplier
    ops:
      - {op: add_field, field: {name: fin_payment_terms_template, type: link, to: PaymentTermsTemplate, label: Payment Terms Template}}

# A supplier's bank details are theirs: an erasure blanks the lines of payment runs that copied them
# (found by the email the line copied too) and, through the app's own part of the erasure
# (src/lib.rs, FinancePersonal), the IBAN and BIC Finance adds to the supplier, which a declaration
# cannot name (the platform checks declarations against the entity before overlays). The bank file a
# run kept is the instruction the bank was given: it stays with the run.
personal_data:
  - {entity: PaymentRun, match: lines.supplier_email, erase: [lines.supplier_name, lines.iban, lines.bic, lines.supplier_email]}

messages:
  - key: finance.remittance_advice
    label: Remittance advice to a supplier
    entity: PaymentEntry
    values: [bills]
    languages:
      en:
        email:
          subject: "Payment {{ doc.number }} of {{ doc.paid_amount }}"
          body: "<p>Dear {{ doc.party_name }},</p><p>We have paid you {{ doc.paid_amount }} on {{ doc.posting_date }} (our payment {{ doc.number }}). It settles: {{ values.bills }}.</p>"
        inapp:
          title: "Payment {{ doc.number }} of {{ doc.paid_amount }}"
          text: "It settles: {{ values.bills }}"

documents:
  - key: finance.bank_transfer_pain001
    label: Credit transfer file (ISO 20022 pain.001)
    entity: PaymentRun
    output: xml
    languages:
      en:
        body: |-
          <?xml version="1.0" encoding="UTF-8"?>
          {% set paid = doc.lines|selectattr("state", "eq", "Paid")|selectattr("round", "eq", doc.rounds)|list %}<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03"><CstmrCdtTrfInitn>
          <GrpHdr><MsgId>{{ doc.number }}-{{ doc.rounds }}</MsgId><CreDtTm>{{ now }}</CreDtTm><NbOfTxs>{{ paid|length }}</NbOfTxs><CtrlSum>{{ paid|total("amount")|fixed(2) }}</CtrlSum><InitgPty><Nm>{{ links.company.company_name }}</Nm></InitgPty></GrpHdr>
          <PmtInf><PmtInfId>{{ doc.number }}-{{ doc.rounds }}</PmtInfId><PmtMtd>TRF</PmtMtd><NbOfTxs>{{ paid|length }}</NbOfTxs><CtrlSum>{{ paid|total("amount")|fixed(2) }}</CtrlSum><ReqdExctnDt>{{ doc.posting_date }}</ReqdExctnDt>
          <Dbtr><Nm>{{ links.company.company_name }}</Nm></Dbtr><DbtrAcct><Id><IBAN>{{ links.bank.iban }}</IBAN></Id></DbtrAcct><DbtrAgt><FinInstnId><BIC>{{ links.bank.swift_code }}</BIC></FinInstnId></DbtrAgt>
          {% for l in paid %}<CdtTrfTxInf><PmtId><EndToEndId>{{ l.invoice_number }}</EndToEndId></PmtId><Amt><InstdAmt Ccy="{{ doc.currency_code }}">{{ l.amount|fixed(2) }}</InstdAmt></Amt><CdtrAgt><FinInstnId><BIC>{{ l.bic }}</BIC></FinInstnId></CdtrAgt><Cdtr><Nm>{{ l.supplier_name }}</Nm></Cdtr><CdtrAcct><Id><IBAN>{{ l.iban }}</IBAN></Id></CdtrAcct><RmtInf><Ustrd>{{ l.invoice_number }}</Ustrd></RmtInf></CdtTrfTxInf>
          {% endfor %}</PmtInf></CstmrCdtTrfInitn></Document>
  - key: finance.bank_transfer_csv
    label: Payments file (CSV)
    entity: PaymentRun
    output: csv
    languages:
      en:
        body: |-
          Supplier,Account,Bank Code,Amount,Currency,Reference,Pay On
          {% for l in doc.lines %}{% if l.state == "Paid" and l.round == doc.rounds %}{{ l.supplier_name }},{{ l.iban }},{{ l.bic }},{{ l.amount|fixed(2) }},{{ doc.currency_code }},{{ l.invoice_number }},{{ doc.posting_date }}
          {% endif %}{% endfor %}

# How four standards' statement files are read (docs/statement-formats.md): records, not code, so a bank's
# variant is a changed or added record. The readers in src/statement.rs know none of them.
seed:
  - entity: StatementFormat
    key: [format_name]
    records:
      - format_name: "ISO 20022 statement (camt.053)"
        kind: Markup
        notes: "Booked entries of each statement; a batch entry is one line."
        reading:
          sniff: ["camt.053"]
          statement: [Stmt]
          account: [Acct/Id/IBAN, Acct/Id/Othr/Id]
          entry: Ntry
          date: [BookgDt/Dt, BookgDt/DtTm, ValDt/Dt]
          date_chars: 10
          amount: [Amt]
          sign: {at: [CdtDbtInd], in: [CRDT], out: [DBIT]}
          only: {at: [Sts/Cd, Sts], is: [BOOK]}
          description: [NtryDtls/TxDtls/RmtInf/Ustrd, AddtlNtryInf]
          reference: [NtryDtls/TxDtls/Refs/EndToEndId, NtryDtls/TxDtls/RmtInf/Strd/CdtrRefInf/Ref]
          bank_reference: [AcctSvcrRef, NtryRef]
          counterparty:
            in: [NtryDtls/TxDtls/RltdPties/Dbtr/Nm, NtryDtls/TxDtls/RltdPties/Dbtr/Pty/Nm]
            out: [NtryDtls/TxDtls/RltdPties/Cdtr/Nm, NtryDtls/TxDtls/RltdPties/Cdtr/Pty/Nm]
          empty: [NOTPROVIDED]
      - format_name: "ISO 20022 account report (camt.052)"
        kind: Markup
        notes: "Booked entries of each account report; a batch entry is one line."
        reading:
          sniff: ["camt.052"]
          statement: [Rpt]
          account: [Acct/Id/IBAN, Acct/Id/Othr/Id]
          entry: Ntry
          date: [BookgDt/Dt, BookgDt/DtTm, ValDt/Dt]
          date_chars: 10
          amount: [Amt]
          sign: {at: [CdtDbtInd], in: [CRDT], out: [DBIT]}
          only: {at: [Sts/Cd, Sts], is: [BOOK]}
          description: [NtryDtls/TxDtls/RmtInf/Ustrd, AddtlNtryInf]
          reference: [NtryDtls/TxDtls/Refs/EndToEndId, NtryDtls/TxDtls/RmtInf/Strd/CdtrRefInf/Ref]
          bank_reference: [AcctSvcrRef, NtryRef]
          counterparty:
            in: [NtryDtls/TxDtls/RltdPties/Dbtr/Nm, NtryDtls/TxDtls/RltdPties/Dbtr/Pty/Nm]
            out: [NtryDtls/TxDtls/RltdPties/Cdtr/Nm, NtryDtls/TxDtls/RltdPties/Cdtr/Pty/Nm]
          empty: [NOTPROVIDED]
      - format_name: "SWIFT MT940"
        kind: Tagged
        notes: "Field 61 is a line, the field 86 after it its text; field 25 the account; a statement ends at a line of '-'."
        reading:
          sniff: [":61:"]
          account: {tag: "25"}
          line:
            tag: "61"
            pattern: '^(?P<date>\d{6})(?:\d{4})?(?P<sign>R?[CD])[A-Z]?(?P<amount>[0-9,]+)[A-Z][A-Z0-9]{3}(?P<reference>[^/\r\n]*)(?://(?P<bank_reference>[^\r\n]*))?'
          detail: {tag: "86", strip: '\?\d\d'}
          sign: {in: [C, RD], out: [D, RC]}
          date_format: "%y%m%d"
          decimal_comma: true
          empty: [NONREF]
      - format_name: "OFX and QFX"
        kind: Markup
        notes: "OFX 1 (SGML) and OFX 2 (XML), bank and card statements."
        reading:
          sniff: ["<OFX>", "OFXHEADER"]
          loose: true
          statement: [STMTRS, CCSTMTRS]
          account: [BANKACCTFROM/ACCTID, CCACCTFROM/ACCTID]
          entry: STMTTRN
          date: [DTPOSTED]
          date_chars: 8
          date_format: "%Y%m%d"
          amount: [TRNAMT]
          description: [NAME, MEMO]
          reference: [CHECKNUM, REFNUM]
          bank_reference: [FITID]
