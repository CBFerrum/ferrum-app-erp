        country: ES
        notes: "Not yet reviewed by an accountant. Source, read on 2026-11-19: the Boletín Oficial del Estado's consolidated text of Real Decreto 1514/2007, Cuarta parte (Cuadro de cuentas): https://www.boe.es/buscar/act.php?id=BOE-A-2007-19884. Rows: groups 1 to 9 as the Plan titles them, their two-digit subgroups and three-digit accounts (groups 8 and 9 to subgroups only), and the four-digit accounts the roles below need. Group 1, 4 and 5 are not rows (each mixes assets and liabilities): their subgroups are the roots, and an account whose nature differs from its subgroup's (407 and 406 in 40, 438 and 437 in 43, 460/465 in 46, 475 in 47, 485 in 48, 499 in 49 and the like) stands on its own. Names are the Plan's, typographical slips included. Added, not in the Plan: Z01 and Z02 (groupings of the public-finance accounts of group 47 that the roles 1150 and 2130 need), Z03 (opening balances, standing for 3300) and Z04 (absorbed overheads, 5130). Roles: 1111 4300, 2111 4000, 2121 4009, 1121 572, 1131 570, 1141 300, 1142 330, 1151 472, 1152 473, 2131 477, 2132 4751, 1170 480, 2150 485, 3200 120, 4110 700, 5110 600, 5120 610, 5210 629, 5260 668, 5270 678: which account plays which role is a reading of their names, not the Plan's. A name the text gives to more than one account carries the account's number in brackets, because a company's account names are unique."
