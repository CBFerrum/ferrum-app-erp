# ERP's add-on for the United States: sales and use tax by destination from rate tables, exemption
# certificates, marketplace facilitators, sales reported to Avalara AvaTax, the economic nexus
# report and Forms 1099. Ferrum localization.md L4.
id: us
name: United States
version: 0.3.0
publisher: cbferrum
summary: Sales and use tax, exemption certificates, economic nexus and Forms 1099 for ERP in the United States
categories: [finance]
runtime: native
platform: ">=0.3.9, <0.4"
# What the operator chooses for the whole installation (Ferrum docs/app-contract.md, Operator settings), kept as
# us.<key> and read at each use; the variable, when set, still wins.
operator_settings:
  - key: avatax_url
    env: FERRUM_US_AVATAX_URL
    applies: live
    doc: Another address for AvaTax. Outside development only AvaTax's own hosts are called, so a company's licence key goes nowhere else.
requires: {erp: ">=0.4"}
parent: erp
packages: [us]
