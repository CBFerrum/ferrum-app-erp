# ERP's add-on for Malaysia: sales and service tax (SST) and the SST-02 summary for ERP in Malaysia. Ferrum localization.md.
id: my
name: "Malaysia"
version: 0.3.1
publisher: cbferrum
summary: "Sales and service tax (SST) and the SST-02 summary for ERP in Malaysia"
categories: [finance]
runtime: native
platform: ">=0.3.9, <0.4"
# What the operator chooses for the whole installation (Ferrum docs/app-contract.md, Operator settings), kept as
# my.<key> and read at each use; the variable, when set, still wins.
operator_settings:
  - key: myinvois_url
    env: FERRUM_MY_MYINVOIS_URL
    applies: live
    doc: Another address for MyInvois. Outside development only MyInvois's own hosts are called, so a company's credentials go nowhere else.
requires: {erp: ">=0.21"}
parent: erp
packages: [my]
