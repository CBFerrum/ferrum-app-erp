package: nz
version: 0.1.1
label: "New Zealand"
description: "New Zealand's GST for ERP. 15%, zero-rated exports, exempt supplies, the reverse charge on imported services, and the GST101A return."
depends: [selling, buying]
field_prefix: nz_

overlays:
  - entity: Company
    ops:
      - {op: add_field, after: tax_id, field: {name: nz_gst_number, type: data, label: "GST Number (NZ)", max_length: 30, description: "The IRD number: on the invoices that charge GST"}}
      - {op: add_field, after: nz_gst_number, field: {name: nz_reverse_charge, type: check, label: "Reverse Charge on Imported Services", description: "Taxable supplies under 95% of all supplies"}}
      - {op: add_field, after: nz_reverse_charge, field: {name: nz_street, type: data, label: "Street (New Zealand)", max_length: 140}}
      - {op: add_field, after: nz_street, field: {name: nz_city, type: data, label: "City (New Zealand)", max_length: 80}}
      - {op: add_field, after: nz_city, field: {name: nz_postal_code, type: data, label: "Postal Code (New Zealand)", max_length: 20}}
      - {op: add_field, after: nz_postal_code, field: {name: nz_peppol_id, type: data, label: "Peppol ID", max_length: 100, description: "scheme:identifier; empty: from the registration number"}}
      - {op: add_field, after: nz_peppol_id, field: {name: nz_peppol_on_submit, type: check, label: "Send E-invoices through Peppol on Submit"}}
      - {op: add_section, after: tax_id, section: {label: "New Zealand GST", collapsible: true, fields: [nz_gst_number, nz_reverse_charge, nz_street, nz_city, nz_postal_code, nz_peppol_id, nz_peppol_on_submit]}}
  - entity: Customer
    ops:
      - {op: add_field, after: tax_id, field: {name: nz_gst_number, type: data, label: "GST Number (NZ)", max_length: 30}}
      - {op: add_field, after: nz_gst_number, field: {name: nz_peppol_id, type: data, label: "Peppol ID", max_length: 100, description: "scheme:identifier; empty: from the registration number"}}
  - entity: Supplier
    ops:
      - {op: add_field, after: tax_id, field: {name: nz_gst_number, type: data, label: "GST Number (NZ)", max_length: 30}}
  - entity: Item
    ops:
      - {op: add_field, after: tax_rates, field: {name: nz_gst_category, type: select, label: "GST Category", options: ["Standard", "Zero Rated", "Exempt", "Out of Scope"], default: "Standard",
          description: "Zero Rated, Exempt or Out of Scope where GST is not charged"}}
      - {op: add_field, after: nz_gst_category, field: {name: nz_kind, type: select, label: "Goods or Services (New Zealand)", options: [Goods, Services],
          description: "Goods are taxed by where they go, services by where the customer is. Empty: goods when it is a stock item"}}
  - entity: SalesInvoice
    ops:
      - {op: add_field, after: customer_name, field: {name: nz_peppol_status, type: select, label: Peppol, options: [Pending, Sent, Failed], read_only: true, no_copy: true, in_filter: true}}
      - {op: add_field, after: nz_peppol_status, field: {name: nz_peppol_message_id, type: data, label: Peppol Message ID, read_only: true, no_copy: true}}
      - {op: add_field, after: nz_peppol_message_id, field: {name: nz_peppol_error, type: text, label: Peppol Error, read_only: true, no_copy: true}}
      - {op: add_action, action: {name: nz_pint, group: e-Invoice, label: Download E-invoice (PINT), docstatus: [1], permission: read, read_only: true,
           contract: {effect: query, returns: {type: object, properties: {file: {type: object, properties: {name: {type: string}, type: {type: string}, content: {type: string}}}}}, completion: "The PINT e-invoice is built from the submitted invoice as a file and nothing is changed or sent"}}}
      - {op: add_action, action: {name: nz_send_peppol, group: e-Invoice, label: Send through Peppol, docstatus: [1], permission: submit, condition: "doc.nz_peppol_status != 'Sent'",
           contract: {effect: external_effect, unknown_outcome: manual, returns: {type: object, properties: {status: {type: string}}}, completion: "The invoice is marked Pending and the request to the customer's Peppol access point is queued with this receipt, to be sent by the company's connector once it commits; the answer is recorded on the invoice (Sent or Failed), and until then a person can record it by hand"}}}
      - {op: add_action, action: {name: nz_record_peppol, group: e-Invoice, label: Record the Access Point's Answer, docstatus: [1], permission: submit,
          params: [{name: message_id, label: Message ID (empty when refused), type: data}, {name: error, label: Error, type: text}],
           contract: {effect: transactional_action, returns: {type: object, properties: {status: {type: string}}}, completion: "The access point's answer for the invoice that waits for it is recorded on it: Sent with the message id given, or Failed with the error, committed with this receipt"}}}

seed:
  # The return is content, not code: a definition over ERP's tax ledger (ERP's TaxReturnDefinition).
  - entity: TaxReturnDefinition
    key: [definition_name]
    records:
      - definition_name: "New Zealand GST101A"
        country: NZ
        frequency: Monthly
        notes: "Inland Revenue's GST101A, boxes 5 to 15, from the tax ledger on the tax fraction 3/23 of amounts that include GST: the boxes in capitals sum the ledger or take the fraction, the form's numbered boxes are formulas over them. The period is a month: set the frequency to the one the company files for."
        boxes:
          - {code: "S_STD", label: "Standard-rated sales", kind: Sum, measure: Base, direction: Output, category: "Standard"}
          - {code: "S_ZR", label: "Zero-rated sales", kind: Sum, measure: Base, direction: Output, category: "Zero Rated"}
          - {code: "S_EXP", label: "Zero-rated exports", kind: Sum, measure: Base, direction: Output, category: "Export"}
          - {code: "S_TAX", label: "GST on sales", kind: Sum, measure: Tax, direction: Output, category: "Standard"}
          - {code: "RC_TAX", label: "GST on imported services (reverse charge)", kind: Sum, measure: Tax, direction: Input, reverse_charge: "Yes"}
          - {code: "P_STD", label: "Standard-rated purchases", kind: Sum, measure: Base, direction: Input, category: "Standard", reverse_charge: "No"}
          - {code: "P_TAX", label: "GST on purchases", kind: Sum, measure: Tax, direction: Input, category: "Standard", reverse_charge: "No"}
          - {code: "G8", label: "Sales including GST, less zero-rated, times 3/23", kind: Formula, formula: "(S_STD + S_TAX) * 3 / 23"}
          - {code: "G12", label: "Purchases including GST, times 3/23", kind: Formula, formula: "(P_STD + P_TAX) * 3 / 23"}
          - {code: "5", label: "Total sales and income for the period (including GST and any zero-rated supplies)", kind: Formula, formula: "S_STD + S_ZR + S_EXP + S_TAX"}
          - {code: "6", label: "Zero-rated supplies included in Box 5", kind: Formula, formula: "S_ZR + S_EXP"}
          - {code: "7", label: "Box 5 less Box 6", kind: Formula, formula: "S_STD + S_TAX"}
          - {code: "8", label: "Box 7 multiplied by three and divided by twenty-three", kind: Formula, formula: "G8"}
          - {code: "9", label: "Adjustments from your calculation sheet", kind: Formula, formula: "RC_TAX"}
          - {code: "10", label: "Total GST collected on sales and income", kind: Formula, formula: "G8 + RC_TAX"}
          - {code: "11", label: "Total purchases and expenses (including GST) for which tax invoicing requirements have been met", kind: Formula, formula: "P_STD + P_TAX"}
          - {code: "12", label: "Box 11 multiplied by three and divided by twenty-three", kind: Formula, formula: "G12"}
          - {code: "13", label: "Credit adjustments from your calculation sheet", kind: Formula, formula: "RC_TAX"}
          - {code: "14", label: "Total GST credit for purchases and expenses", kind: Formula, formula: "G12 + RC_TAX"}
          - {code: "15", label: "Difference between Box 10 and Box 14 (GST to pay, or a refund when negative)", kind: Formula, formula: "G8 + RC_TAX - G12 - RC_TAX"}
