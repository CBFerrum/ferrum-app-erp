package: nz
version: 0.1.1
label: "New Zealand"
description: "New Zealand's GST for ERP. 15%, zero-rated exports, exempt supplies, the reverse charge on imported services, and the GST101A return."
depends: [selling, buying]
field_prefix: nz_

overlays:
  - entity: Company
    ops:
      - {op: add_field, after: tax_id, field: {name: nz_gst_number, type: data, label: "GST Number (NZ)", max_length: 30, description: "The IRD number: on the invoices that charge GST"}}
      - {op: add_field, after: nz_gst_number, field: {name: nz_reverse_charge, type: check, label: "Reverse Charge on Imported Services", description: "Taxable supplies under 95% of all supplies"}}
      - {op: add_field, after: nz_reverse_charge, field: {name: nz_street, type: data, label: "Street (New Zealand)", max_length: 140}}
      - {op: add_field, after: nz_street, field: {name: nz_city, type: data, label: "City (New Zealand)", max_length: 80}}
      - {op: add_field, after: nz_city, field: {name: nz_postal_code, type: data, label: "Postal Code (New Zealand)", max_length: 20}}
      - {op: add_field, after: nz_postal_code, field: {name: nz_peppol_id, type: data, label: "Peppol ID", max_length: 100, description: "scheme:identifier; empty: from the registration number"}}
      - {op: add_field, after: nz_peppol_id, field: {name: nz_peppol_on_submit, type: check, label: "Send E-invoices through Peppol on Submit"}}
      - {op: add_section, after: tax_id, section: {label: "New Zealand GST", collapsible: true, fields: [nz_gst_number, nz_reverse_charge, nz_street, nz_city, nz_postal_code, nz_peppol_id, nz_peppol_on_submit]}}
  - entity: Customer
    ops:
      - {op: add_field, after: tax_id, field: {name: nz_gst_number, type: data, label: "GST Number (NZ)", max_length: 30}}
      - {op: add_field, after: nz_gst_number, field: {name: nz_peppol_id, type: data, label: "Peppol ID", max_length: 100, description: "scheme:identifier; empty: from the registration number"}}
  - entity: Supplier
    ops:
      - {op: add_field, after: tax_id, field: {name: nz_gst_number, type: data, label: "GST Number (NZ)", max_length: 30}}
  - entity: Item
    ops:
      - {op: add_field, after: tax_rates, field: {name: nz_gst_category, type: select, label: "GST Category", options: ["Standard", "Zero Rated", "Exempt", "Out of Scope"], default: "Standard",
          description: "Zero Rated, Exempt or Out of Scope where GST is not charged"}}
      - {op: add_field, after: nz_gst_category, field: {name: nz_kind, type: select, label: "Goods or Services (New Zealand)", options: [Goods, Services],
          description: "Goods are taxed by where they go, services by where the customer is. Empty: goods when it is a stock item"}}
  - entity: SalesInvoice
    ops:
      - {op: add_field, after: customer_name, field: {name: nz_peppol_status, type: select, label: Peppol, options: [Pending, Sent, Failed], read_only: true, no_copy: true, in_filter: true}}
      - {op: add_field, after: nz_peppol_status, field: {name: nz_peppol_message_id, type: data, label: Peppol Message ID, read_only: true, no_copy: true}}
      - {op: add_field, after: nz_peppol_message_id, field: {name: nz_peppol_error, type: text, label: Peppol Error, read_only: true, no_copy: true}}
      - {op: add_action, action: {name: nz_pint, group: e-Invoice, label: Download E-invoice (PINT), docstatus: [1], permission: read, read_only: true}}
      - {op: add_action, action: {name: nz_send_peppol, group: e-Invoice, label: Send through Peppol, docstatus: [1], permission: submit, condition: "doc.nz_peppol_status != 'Sent'"}}
      - {op: add_action, action: {name: nz_record_peppol, group: e-Invoice, label: Record the Access Point's Answer, docstatus: [1], permission: submit,
          params: [{name: message_id, label: Message ID (empty when refused), type: data}, {name: error, label: Error, type: text}]}}
