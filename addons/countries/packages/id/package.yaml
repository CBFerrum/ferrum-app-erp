package: id
version: 0.1.0
label: "Indonesia"
description: "Indonesia's PPN for ERP. 12% on a tax base of 11/12 of the price (11% in effect) and the full 12% on luxury goods, exports at 0%, exempt deliveries, PPN on services used from abroad, and SPT Masa PPN's figures."
depends: [selling, buying]
field_prefix: id_

overlays:
  - entity: Company
    ops:
      - {op: add_field, after: tax_id, field: {name: id_npwp, type: data, label: "NPWP", max_length: 30, description: "16 digits (a 15-digit NPWP gains a leading zero): on the invoices that charge PPN"}}
      - {op: add_section, after: tax_id, section: {label: "Indonesia PPN", collapsible: true, fields: [id_npwp]}}
  - entity: Customer
    ops:
      - {op: add_field, after: tax_id, field: {name: id_npwp, type: data, label: "NPWP", max_length: 30}}
  - entity: Supplier
    ops:
      - {op: add_field, after: tax_id, field: {name: id_npwp, type: data, label: "NPWP", max_length: 30}}
  - entity: Item
    ops:
      - {op: add_field, after: tax_rates, field: {name: id_ppn_category, type: select, label: "PPN Category", options: ["Standard", "Luxury", "Zero Rated", "Exempt", "Out of Scope"], default: "Standard",
          description: "Standard: 12% on 11/12 of the price (PMK 131/2024); Luxury: 12% on the full price"}}
      - {op: add_field, after: id_ppn_category, field: {name: id_kind, type: select, label: "Goods or Services (Indonesia)", options: [Goods, Services],
          description: "Goods are taxed by where they go, services by where the customer is. Empty: goods when it is a stock item"}}
  # The return's boxes sum the tax ledger by this country's own categories too.
  - entity: TaxReturnBoxDefinition
    ops:
      - {op: add_options, field: category, options: ["Luxury"]}

seed:
  # The return is content, not code: a definition over ERP's tax ledger (ERP's TaxReturnDefinition).
  - entity: TaxReturnDefinition
    key: [definition_name]
    records:
      - definition_name: "Indonesia SPT Masa PPN"
        country: ID
        frequency: Monthly
        notes: "SPT Masa PPN's figures from the tax ledger: the boxes in capitals without a form number sum the ledger for the form's boxes. The period is a month: set the frequency to the one the company files for."
        boxes:
          - {code: "EXPS", label: "Exports", kind: Sum, measure: Base, direction: Output, category: "Export"}
          - {code: "ZRS", label: "Zero-rated deliveries", kind: Sum, measure: Base, direction: Output, category: "Zero Rated"}
          - {code: "STD", label: "Standard deliveries", kind: Sum, measure: Base, direction: Output, category: "Standard"}
          - {code: "LUX", label: "Luxury goods deliveries", kind: Sum, measure: Base, direction: Output, category: "Luxury"}
          - {code: "STD_TAX", label: "PPN on standard deliveries", kind: Sum, measure: Tax, direction: Output, category: "Standard"}
          - {code: "LUX_TAX", label: "PPN on luxury goods", kind: Sum, measure: Tax, direction: Output, category: "Luxury"}
          - {code: "IN_STD", label: "PPN on standard purchases", kind: Sum, measure: Tax, direction: Input, category: "Standard", reverse_charge: "No"}
          - {code: "IN_LUX", label: "PPN on luxury goods purchased", kind: Sum, measure: Tax, direction: Input, category: "Luxury", reverse_charge: "No"}
          - {code: "A1", label: "Ekspor (export)", kind: Formula, formula: "EXPS + ZRS"}
          - {code: "A2", label: "Penyerahan yang PPN-nya harus dipungut sendiri (taxable deliveries)", kind: Formula, formula: "STD + LUX"}
          - {code: "A3", label: "Penyerahan yang dibebaskan dari pengenaan PPN (exempt deliveries)", kind: Sum, measure: Base, direction: Output, category: "Exempt"}
          - {code: "PK", label: "PPN Keluaran (output tax)", kind: Formula, formula: "STD_TAX + LUX_TAX"}
          - {code: "JLN", label: "PPN atas pemanfaatan JKP dari luar Daerah Pabean (services from abroad)", kind: Sum, measure: Tax, direction: Input, reverse_charge: "Yes"}
          - {code: "PM", label: "Pajak Masukan yang dapat dikreditkan (creditable input tax)", kind: Formula, formula: "IN_STD + IN_LUX + JLN"}
          - {code: "KB", label: "PPN kurang (lebih) bayar (payable, or overpaid when negative)", kind: Formula, formula: "PK + JLN - PM"}
