id: mes
name: Manufacturing Execution
version: 0.2.4
publisher: cbferrum
summary: Approved revisions, release gates, execution events, lot genealogy and OEE on ERP's work orders
description: README.md
categories: [manufacturing]
license: AGPL-3.0-only
runtime: native
platform: ">=0.3.6, <0.4"
requires: {erp: ">=0.1", mfg-ops: ">=0.1", quality: ">=0.1", ops: ">=0.2"}
parent: erp
packages: [mes]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - {id: mes, route: mes, title: Shop Floor, description: "What runs where, and how it is going", icon: factory, color: "#7c3aed", roles: [Production Supervisor, Production Operator]}
  shell.open:
    - {id: mes, package: mes, path: "mes/e/{entity}/{id}", list: "mes/e/{entity}"}
  shell.create:
    - {id: run, label: Production run, path: mes/e/ProductionRun/new, entity: ProductionRun}
