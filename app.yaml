# ERP as an app of its own (Ferrum docs/plan/erp-repo.md): accounting, selling, buying, stock and
# manufacturing, with its interface at /erp/ (ui/, built into ui/dist and embedded in this crate).
# Its packages (packages/, with the engine in src/) build on the customers, suppliers and items
# other apps share (ferrum-domain's parties and products) and add their ERP fields to them.
# Recorded as installed in every workspace that has accounting; India is its add-on (addons/india).
id: erp
name: ERP
version: 0.3.0
publisher: cbferrum
summary: Accounting, selling, buying, stock and manufacturing
categories: [finance, inventory, manufacturing]
license: AGPL-3.0-or-later
homepage: https://github.com/CBFerrum/ferrum-app-erp
support: https://github.com/CBFerrum/ferrum-app-erp/issues
runtime: native
platform: ">=0.3.1, <0.4"
packages: [accounting, inventory, buying, selling, manufacturing]
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: erp
      route: erp
      title: ERP
      description: Accounting, selling, buying, stock and manufacturing
      icon: building-2
      color: "#2f5bea"
      roles: [Accounts Manager, Accounts User, Sales Manager, Sales User, Purchase Manager, Purchase User, Stock Manager, Stock User, Manufacturing Manager, Manufacturing User]
  shell.open:
    - {id: core, package: core, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: parties, package: parties, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: products, package: products, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: accounting, package: accounting, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: selling, package: selling, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: buying, package: buying, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: inventory, package: inventory, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: manufacturing, package: manufacturing, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    # Its add-ons' records (their modules are in ERP's sidebar), and the projects its accounting uses.
    - {id: india, package: india, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: finance, package: finance, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: procurement, package: procurement, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: stock_ops, package: stock_ops, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: mfg_ops, package: mfg_ops, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: project_records, package: project_records, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
  # The workspace's portal: a customer's own invoices at /portal/invoices/ (the selling package's
  # endpoints), where /open of an invoice takes portal people.
  shell.portal:
    - {id: invoices, title: Your invoices, description: What you were billed and what is still to pay, entity: SalesInvoice, open: "{id}"}
